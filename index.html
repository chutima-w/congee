    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });

    function rerender(){
      const box = document.getElementById('tf-modal-box');
      box.innerHTML = bodyHtml();
      bindEvents();
    }

    function bindEvents(){
      const box = document.getElementById('tf-modal-box');
      box.querySelector('#tf-cancel').onclick = ()=>overlay.remove();
      const inBtn = box.querySelector('#tf-type-in');
      const outBtn = box.querySelector('#tf-type-out');
      if(inBtn) inBtn.onclick = ()=>{ captureDraft(); draft.type='in'; rerender(); };
      if(outBtn) outBtn.onclick = ()=>{ captureDraft(); draft.type='out'; rerender(); };
      const itemSel = box.querySelector('#tf-item');
      if(itemSel) itemSel.onchange = ()=>{ captureDraft(); rerender(); };
      function updateComputedHint(){
        const qtyEl = box.querySelector('#tf-qty');
        const tpEl = box.querySelector('#tf-totalprice');
        const hint = box.querySelector('#tf-computed-unit');
        if(!qtyEl || !tpEl || !hint) return;
        const qty = parseFloat(qtyEl.value)||0;
        const tp = parseFloat(tpEl.value)||0;
        hint.textContent = (qty>0 && tp>0) ? `≈ ฿${fmtMoney(tp/qty)} ต่อหน่วย` : 'กรอกจำนวนและราคารวม เพื่อคำนวณต้นทุนต่อหน่วยให้อัตโนมัติ';
      }
      const qtyInput = box.querySelector('#tf-qty');
      if(qtyInput) qtyInput.oninput = updateComputedHint;
      const totalPriceInput = box.querySelector('#tf-totalprice');
      if(totalPriceInput) totalPriceInput.oninput = updateComputedHint;
      const saveBtn = box.querySelector('#tf-save');
      if(saveBtn) saveBtn.onclick = (ev)=>{
        captureDraft();
        const itemId = draft.itemId;
        const date = draft.date;
        const qty = parseFloat(draft.quantity)||0;
        if(qty<=0){ toast('กรุณาระบุจำนวนมากกว่า 0'); return; }
        if(!date){ toast('กรุณาระบุวันที่'); return; }

        if(draft.type==='out'){
          const {state} = computeLedger();
          const existing = t;
          const s = currentStockFor(itemId, state);
          const availableQty = existing && existing.itemId===itemId && existing.type==='out' ? s.qty + Number(existing.quantity||0) : s.qty;
          if(qty > availableQty){
            if(!window.confirm(`คงเหลือปัจจุบันมีเพียง ${fmtNum(availableQty)} หน่วย แต่จะตัดออก ${fmtNum(qty)} หน่วย ทำให้ติดลบ ต้องการดำเนินการต่อหรือไม่?`)) return;
          }
        }

        withLoading(ev.currentTarget, 'กำลังบันทึก...', async ()=>{
          const payload = {
            id: t?t.id:uid('t'),
            type: draft.type,
            itemId,
            date,
            quantity: qty,
            unitCost: draft.type==='in' ? (qty>0 ? (parseFloat(draft.totalPrice)||0)/qty : 0) : 0,
            note: box.querySelector('#tf-note').value.trim(),
          };
          if(t){ transactions[transactions.findIndex(x=>x.id===t.id)] = payload; }
          else{ transactions.push(payload); }
          await saveTx();
          overlay.remove();
          render();
          toast(t?'แก้ไขรายการแล้ว':'บันทึกรายการแล้ว');
        });
      };
    }
    bindEvents();
  }

  function confirmDeleteTx(id){
    const t = transactions.find(x=>x.id===id);
    if(!t) return;
    const item = master.find(m=>m.id===t.itemId);
    const overlay = document.createElement('div');
    overlay.className='sw-overlay';
    overlay.innerHTML = `
      <div class="sw-modal" style="max-width:380px;">
        <h2>ยืนยันการลบ</h2>
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 20px;">
          ต้องการลบรายการ <b style="color:var(--ink);">${t.type==='in'?'รับเข้า':'ตัดออก'} ${escapeHtml(item?item.name:'')}</b>
          จำนวน ${fmtNum(t.quantity)} เมื่อ ${fmtDate(t.date)} ใช่หรือไม่? การลบจะกระทบการคำนวณสต๊อกทั้งหมด
        </p>
        <div class="sw-modal-actions">
          <button class="sw-btn-secondary" id="tdel-cancel">ยกเลิก</button>
          <button class="sw-btn-danger" id="tdel-confirm">ลบรายการ</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#tdel-cancel').onclick = ()=>overlay.remove();
    overlay.querySelector('#tdel-confirm').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังลบ...', async ()=>{
        transactions = transactions.filter(x=>x.id!==id);
        await saveTx();
        overlay.remove();
        render();
        toast('ลบรายการแล้ว');
      });
    };
  }

  loadAll();
})();

</script>
<script>

(function(){
  const EVENTS_KEY = 'events_list';
  const MASTER_KEY = 'supplies_master_list';
  const TX_KEY = 'supplies_transactions_list';
  const PARTNERS_KEY = 'business_partners';
  const ORDERS_KEY = 'orders_list';
  const DEFAULT_INGREDIENTS = ['ข้าวสาร','หมูสับ','เห็ดหอม','ต้นหอมผักชี','ขิงอ่อน','กระเทียม','น้ำมัน','ไข่'];

  let events = [];
  let master = [];
  let transactions = [];
  let partners = [{name:'หุ้นส่วน 1', share:50},{name:'หุ้นส่วน 2', share:50}];
  let ingredientsMaster = [];
  let otherCostsMaster = [];
  let orders = [];
  let menuSupplyUsage = [];
  let statusFilter = 'all';

  const root = document.getElementById('ev-root');

  function fmtMoney(n){ return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function fmtNum(n){ return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function fmtDate(d){ if(!d) return '-'; try{ return new Date(d).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return d; } }
  function defaultEventName(date){ return 'รอบขาย '+fmtDate(date); }
  function uid(p){ return (p||'x')+Date.now()+Math.random().toString(36).slice(2,7); }

  // สรุปยอดขายจริงจากออเดอร์ของรอบนี้ แยกรายเมนู — ไม่เก็บซ้ำ คำนวณสดจาก orders เสมอ
  function computeOrderSummary(eventId){
    const relevant = eventId ? orders.filter(o=> o.eventId===eventId && o.status!=='cancelled') : [];
    const byKey = {};
    relevant.forEach(o=>{
      (o.items||[]).forEach(it=>{
        const key = it.menuItemId || ('name:'+it.name);
        if(!byKey[key]) byKey[key] = { menuItemId: it.menuItemId||null, name: it.name, qty:0, revenue:0 };
        byKey[key].qty += Number(it.qty)||0;
        byKey[key].revenue += (Number(it.qty)||0)*Number(it.price||0);
      });
    });
    const rows = Object.values(byKey).sort((a,b)=> b.qty-a.qty);
    const totalBowls = rows.reduce((s,r)=>s+r.qty,0);
    const totalRevenue = rows.reduce((s,r)=>s+r.revenue,0);
    return { rows, totalBowls, totalRevenue };
  }
  // จำนวนวัตถุดิบที่ควรใช้อัตโนมัติ = แบบผันแปรตามชามรวม (เดิม) + แบบตามสูตรเฉพาะเมนู (ใหม่)
  function computeAutoSupplyQty(supplyItemId, orderSummary){
    const hasRecipe = menuSupplyUsage.some(x=>x.supplyItemId===supplyItemId);
    let qty = 0;
    if(hasRecipe){
      // มีสูตรเฉพาะเมนูแล้ว ใช้ตัวนี้อย่างเดียว ไม่บวกซ้ำกับสูตรผันแปรตามชามแบบเหมารวม
      orderSummary.rows.forEach(r=>{
        if(!r.menuItemId) return;
        const recipe = menuSupplyUsage.find(x=>x.supplyItemId===supplyItemId && x.menuItemId===r.menuItemId);
        if(recipe) qty += r.qty * Number(recipe.qtyPerUnit||0);
      });
    }else{
      const m = master.find(x=>x.id===supplyItemId);
      if(m && m.usageType==='per_bowl'){
        qty += orderSummary.totalBowls * Number(m.qtyPerBowl||0);
      }
    }
    return qty;
  }
  function relevantAutoSupplyIds(orderSummary){
    const ids = new Set();
    const recipeSupplyIds = new Set(menuSupplyUsage.map(x=>x.supplyItemId));
    master.filter(m=>m.usageType==='per_bowl' && !recipeSupplyIds.has(m.id)).forEach(m=>ids.add(m.id));
    orderSummary.rows.forEach(r=>{
      if(!r.menuItemId) return;
      menuSupplyUsage.filter(x=>x.menuItemId===r.menuItemId).forEach(x=>ids.add(x.supplyItemId));
    });
    return ids;
  }
  function withLoading(btn, loadingText, fn){
    if(btn.disabled) return;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.style.opacity = '.6';
    btn.style.cursor = 'wait';
    btn.textContent = loadingText;
    Promise.resolve(fn()).catch(()=>{}).finally(()=>{
      if(document.body.contains(btn)){
        btn.disabled = false;
        btn.style.opacity = '';
        btn.style.cursor = '';
        btn.innerHTML = original;
      }
    });
  }
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }

  function iconPencil(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>'; }
  function iconTrash(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>'; }
  function iconPlus(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'; }
  function iconCheck(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'; }
  function iconRefresh(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>'; }

  async function loadAll(){
    try{
      const evRows = await window.dbLoadTable('events');
      const children = await window.dbLoadEventChildren();
      events = evRows.map(r=>({
        id: r.id, status: r.status, name: r.name, location: r.location, date: r.date, note: r.note,
        bowlsSold: r.bowls_sold, cashRevenue: r.cash_revenue, transferRevenue: r.transfer_revenue,
        closedAt: r.closed_at,
        finalRevenue: r.final_revenue, finalCashRevenue: r.final_cash_revenue, finalTransferRevenue: r.final_transfer_revenue,
        finalCost: r.final_cost, finalProfit: r.final_profit, finalBowls: r.final_bowls,
        rawIngredients: children.ing.filter(i=>i.event_id===r.id).map(i=>({id:i.id, name:i.name, quantity:i.quantity, unit:i.unit, price:i.price})),
        otherCosts: children.cost.filter(c=>c.event_id===r.id).map(c=>({id:c.id, description:c.description, amount:c.amount})),
        usage: children.usage.filter(u=>u.event_id===r.id).map(u=>({itemId:u.item_id, qty:u.qty, auto:u.auto, removed:u.removed})),
      }));
    }catch(err){ events = []; }
    try{
      const rows = await window.dbLoadTable('supplies_master');
      master = rows.map(r=>({
        id: r.id, name: r.name, unit: r.unit, category: r.category,
        usageType: r.usage_type, qtyPerBowl: r.qty_per_bowl, minStock: r.min_stock
      }));
    }catch(err){ master = []; }
    try{
      const rows = await window.dbLoadTable('supplies_transactions');
      transactions = rows.map(r=>({
        id: r.id, type: r.type, itemId: r.item_id, date: r.date,
        quantity: r.quantity, unitCost: r.unit_cost, note: r.note, eventId: r.event_id
      }));
    }catch(err){ transactions = []; }
    try{
      const rows = await window.dbLoadTable('orders');
      const children = await window.dbLoadOrderChildren();
      orders = rows.map(r=>({
        id: r.id, status: r.status, eventId: r.event_id, createdAt: r.created_at,
        items: children.items.filter(i=>i.order_id===r.id).map(i=>({menuItemId:i.menu_item_id, name:i.name, price:i.price, qty:i.qty})),
      }));
    }catch(err){ orders = []; }
    try{
      const rows = await window.dbLoadTable('partners');
      if(rows.length) partners = rows.map(r=>({name: r.name, share: r.share}));
    }catch(err){ /* keep default */ }
    try{
      ingredientsMaster = await window.dbLoadTable('ingredients_master');
    }catch(err){ ingredientsMaster = []; }
    try{
      otherCostsMaster = await window.dbLoadTable('other_costs_master');
    }catch(err){ otherCostsMaster = []; }
    try{
      const rows = await window.dbLoadTable('menu_supply_usage');
      menuSupplyUsage = rows.map(r=>({menuItemId:r.menu_item_id, supplyItemId:r.supply_item_id, qtyPerUnit:r.qty_per_unit}));
    }catch(err){ menuSupplyUsage = []; }
    render();
  }
  async function saveEvents(){
    try{
      const rows = events.map(e=>({
        id: e.id, status: e.status, name: e.name, location: e.location || '', date: e.date || null, note: e.note || '',
        bowls_sold: Number(e.bowlsSold)||0, cash_revenue: Number(e.cashRevenue)||0, transfer_revenue: Number(e.transferRevenue)||0,
        closed_at: e.closedAt || null,
        final_revenue: e.finalRevenue==null?null:Number(e.finalRevenue),
        final_cash_revenue: e.finalCashRevenue==null?null:Number(e.finalCashRevenue),
        final_transfer_revenue: e.finalTransferRevenue==null?null:Number(e.finalTransferRevenue),
        final_cost: e.finalCost==null?null:Number(e.finalCost),
        final_profit: e.finalProfit==null?null:Number(e.finalProfit),
        final_bowls: e.finalBowls==null?null:Number(e.finalBowls),
      }));
      const ok = await window.dbSyncTable('events', 'id', rows);
      if(!ok){ toast('บันทึกไม่สำเร็จ'); return; }

      const eventIds = events.map(e=>e.id);
      const ingRows = [], costRows = [], usageRows = [];
      events.forEach(e=>{
        (e.rawIngredients||[]).forEach(i=> ingRows.push({
          id: i.id, event_id: e.id, name: i.name || '',
          quantity: (i.quantity===''||i.quantity==null) ? null : Number(i.quantity),
          unit: i.unit || '',
          price: (i.price===''||i.price==null) ? null : Number(i.price)
        }));
        (e.otherCosts||[]).forEach(c=> costRows.push({
          id: c.id, event_id: e.id, description: c.description || '', amount: Number(c.amount)||0
        }));
        (e.usage||[]).forEach(u=> usageRows.push({
          event_id: e.id, item_id: u.itemId, qty: Number(u.qty)||0, auto: !!u.auto, removed: !!u.removed
        }));
      });
      await window.dbSyncEventChildren(eventIds, ingRows, costRows, usageRows);

      // เพิ่มชื่อวัตถุดิบใหม่ที่ยังไม่มีใน master เข้าไปอัตโนมัติ
      const knownNames = new Set(ingredientsMaster.map(m=>m.name));
      const newNames = new Set();
      events.forEach(e=> (e.rawIngredients||[]).forEach(i=>{
        const n = (i.name||'').trim();
        if(n && !knownNames.has(n)) newNames.add(n);
      }));
      if(newNames.size){
        const newRows = Array.from(newNames).map(n=>({id: 'ingm_'+n.replace(/\s+/g,'_'), name: n}));
        await window.supabaseClient.from('ingredients_master').upsert(newRows, {onConflict:'name', ignoreDuplicates:true});
        ingredientsMaster = ingredientsMaster.concat(newRows);
      }
    }catch(e){ toast('เกิดข้อผิดพลาดในการบันทึก'); }
  }
  async function saveTx(){
    try{
      const rows = transactions.map(t=>({
        id: t.id, type: t.type, item_id: t.itemId, date: t.date || null,
        quantity: Number(t.quantity)||0, unit_cost: Number(t.unitCost)||0,
        note: t.note || '', event_id: t.eventId || null
      }));
      const ok = await window.dbSyncTable('supplies_transactions', 'id', rows);
      if(!ok) toast('บันทึกไม่สำเร็จ');
    }catch(e){ toast('เกิดข้อผิดพลาดในการบันทึก'); }
  }
  async function savePartners(){
    try{
      const rows = partners.map(p=>({name: p.name, share: Number(p.share)||0}));
      const ok = await window.dbSyncTable('partners', 'name', rows);
      if(!ok) toast('บันทึกไม่สำเร็จ');
    }catch(e){ toast('บันทึกไม่สำเร็จ'); }
  }
  function toast(msg){ const t=document.createElement('div'); t.className='ev-toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

  // ---- Costing engine (mirrors Supplies module) ----
  function computeLedgerState(){
    const state = {};
    const sorted = [...transactions].sort((a,b)=> new Date(a.date)-new Date(b.date) || String(a.id).localeCompare(String(b.id)));
    sorted.forEach(tx=>{
      if(!state[tx.itemId]) state[tx.itemId] = {qty:0, value:0};
      const s = state[tx.itemId];
      if(tx.type==='in'){
        const cost = Number(tx.quantity||0)*Number(tx.unitCost||0);
        s.qty += Number(tx.quantity)||0; s.value += cost;
      }else{
        const avg = s.qty>0 ? s.value/s.qty : 0;
        const outQty = Number(tx.quantity)||0;
        s.qty -= outQty; s.value -= avg*outQty;
        if(s.qty<0.0001){ s.qty=0; } if(s.value<0){ s.value=0; }
      }
    });
    return state;
  }
  function avgCostFor(itemId, state){ const s=state[itemId]; if(!s||s.qty<=0) return 0; return s.value/s.qty; }

  // ============ DASHBOARD AGGREGATES ============
  function aggregates(){
    const closed = events.filter(e=>e.status==='closed');
    const totalRevenue = closed.reduce((s,e)=>s+Number(e.finalRevenue||0),0);
    const totalCost = closed.reduce((s,e)=>s+Number(e.finalCost||0),0);
    const totalProfit = totalRevenue - totalCost;
    const totalBowls = closed.reduce((s,e)=>s+Number(e.finalBowls||0),0);
    const avgBowls = closed.length>0 ? totalBowls/closed.length : 0;
    return {closedCount:closed.length, totalRevenue, totalCost, totalProfit, totalBowls, avgBowls};
  }

  // ============ RENDER ============
  function render(){
    const agg = aggregates();
    let list = [...events].sort((a,b)=> new Date(b.date)-new Date(a.date) || String(b.id).localeCompare(String(a.id)));
    if(statusFilter!=='all') list = list.filter(e=>e.status===statusFilter);

    root.innerHTML = `
      <div class="ev-header">
        <h1 class="ev-title">Events</h1>
        <div class="ev-sub">รอบขาย — บันทึกต้นทุน รายได้ และกำไรของแต่ละรอบขายโจ๊ก ตัดสต๊อกให้อัตโนมัติหลังปิดรอบ</div>
        <div class="ev-partners-link" id="ev-partners-btn">🤝 หุ้นส่วน: ${partners.map(p=>`${escapeHtml(p.name)} ${p.share}%`).join(' · ')} · แก้ไข</div>
      </div>

      <div class="ev-hero">
        <div class="ev-hero-grid">
          <div class="ev-hero-stat"><div class="lbl">รายได้ทั้งหมด</div><div class="val">฿${fmtMoney(agg.totalRevenue)}</div></div>
          <div class="ev-hero-stat"><div class="lbl">ต้นทุนทั้งหมด</div><div class="val cost">฿${fmtMoney(agg.totalCost)}</div></div>
          <div class="ev-hero-stat"><div class="lbl">กำไรทั้งหมด</div><div class="val profit">฿${fmtMoney(agg.totalProfit)}</div></div>
          <div class="ev-hero-stat"><div class="lbl">จำนวนขายทั้งหมด</div><div class="val">${fmtNum(agg.totalBowls)} ชาม</div></div>
        </div>
        <div class="ev-hero-secondary">
          <div><div class="lbl">เฉลี่ยต่อรอบ</div><div class="val">${fmtNum(agg.avgBowls)} ชาม/รอบ</div></div>
          <div><div class="lbl">รอบที่ปิดแล้ว</div><div class="val" style="color:var(--ink);">${agg.closedCount} รอบ</div></div>
        </div>
        <div class="ev-hero-note">* ตัวเลขสรุปนับเฉพาะรอบที่ "ปิดรอบ" แล้วเท่านั้น (รอบที่ยังเปิดอยู่ยังไม่รวมในนี้)</div>
      </div>

      <div class="ev-toolbar">
        <button class="ev-chip ${statusFilter==='all'?'active':''}" data-ef="all">ทั้งหมด</button>
        <button class="ev-chip ${statusFilter==='open'?'active':''}" data-ef="open">กำลังขาย</button>
        <button class="ev-chip ${statusFilter==='closed'?'active':''}" data-ef="closed">ปิดรอบแล้ว</button>
        <button class="ev-add" id="ev-add-btn">${iconPlus()} ${events.find(ev=>ev.status==='open')?'ไปที่รอบที่เปิดอยู่':'เพิ่มรอบขาย'}</button>
      </div>

      <div class="ev-list">
        ${list.length===0?`<div class="ev-empty">ยังไม่มีรอบขาย — กด "เพิ่มรอบขาย" เพื่อเริ่มบันทึก</div>`:list.map(eventRow).join('')}
      </div>
    `;

    document.getElementById('ev-partners-btn').onclick = openPartnersModal;
    document.getElementById('ev-add-btn').onclick = ()=>{
      const existingOpen = events.find(ev=>ev.status==='open');
      if(existingOpen){
        toast('มีรอบขายเปิดอยู่แล้ว — ปิดรอบเดิมก่อนถึงจะเปิดรอบใหม่ได้');
        openEventModal(existingOpen.id);
        return;
      }
      openEventModal(null);
    };
    root.querySelectorAll('[data-ef]').forEach(b=> b.onclick = ()=>{ statusFilter=b.dataset.ef; render(); });
    root.querySelectorAll('[data-erow]').forEach(el=> el.onclick = ()=>openEventModal(el.dataset.erow));
  }

  function eventRow(e){
    const state = computeLedgerState();
    let cost, revenue, profit, bowls, cash, transfer;
    if(e.status==='closed'){
      cost = e.finalCost; revenue = e.finalRevenue; profit = e.finalProfit; bowls = e.finalBowls;
      cash = e.finalCashRevenue; transfer = e.finalTransferRevenue;
    }else{
      const suppliesCost = (e.usage||[]).filter(u=>!u.removed).reduce((s,u)=> s+Number(u.qty||0)*avgCostFor(u.itemId,state), 0);
      const ingredientsCost = (e.rawIngredients||[]).reduce((s,i)=>s+Number(i.price||0),0);
      const otherCost = (e.otherCosts||[]).reduce((s,c)=>s+Number(c.amount||0),0);
      cost = suppliesCost+ingredientsCost+otherCost;
      cash = Number(e.cashRevenue||0); transfer = Number(e.transferRevenue||0);
      revenue = cash+transfer; profit = revenue-cost; bowls = Number(e.bowlsSold||0);
    }
    return `
      <div class="ev-row ${e.status==='closed'?'closed':''}" data-erow="${e.id}">
        <div class="ev-row-top">
          <span class="ev-row-name">${escapeHtml(e.name)}</span>
          ${e.location?`<span class="ev-row-date" style="color:var(--ink-soft);">📍 ${escapeHtml(e.location)}</span>`:''}
          <span class="ev-tag ${e.status}">${e.status==='closed'?'ปิดรอบแล้ว':'กำลังขาย'}</span>
          <span class="ev-row-date" style="margin-left:auto;">${fmtDate(e.date)}</span>
        </div>
        <div class="ev-row-nums">
          <div class="item"><div class="lbl">ชาม</div><div class="val">${fmtNum(bowls)}</div></div>
          <div class="item"><div class="lbl">รายได้ (สด/โอน)</div><div class="val">฿${fmtMoney(revenue)} <span style="color:var(--ink-soft);font-weight:400;">(${fmtMoney(cash)}/${fmtMoney(transfer)})</span></div></div>
          <div class="item"><div class="lbl">ต้นทุน</div><div class="val cost">฿${fmtMoney(cost)}</div></div>
          <div class="item"><div class="lbl">กำไร</div><div class="val profit">฿${fmtMoney(profit)}</div></div>
        </div>
      </div>
    `;
  }

  // ============ PARTNERS MODAL ============
  function openPartnersModal(){
    const draft = JSON.parse(JSON.stringify(partners));
    const overlay = document.createElement('div');
    overlay.className='ev-overlay';
    function bodyHtml(){
      return `
        <h2>ตั้งค่าหุ้นส่วน</h2>
        <div class="ev-hint">กำหนดชื่อและสัดส่วนแบ่งกำไรของแต่ละคน (รวมกันควรเป็น 100%)</div>
        ${draft.map((p,i)=>`
          <div class="ev-row2" style="margin-bottom:10px;">
            <div class="ev-field" style="margin-bottom:0;"><input data-pname="${i}" value="${escapeHtml(p.name)}" placeholder="ชื่อหุ้นส่วน"></div>
            <div class="ev-field" style="margin-bottom:0;max-width:90px;"><input data-pshare="${i}" type="number" min="0" max="100" value="${p.share}" placeholder="%"></div>
          </div>
        `).join('')}
        <div class="ev-modal-actions">
          <button class="ev-btn-secondary" id="pf-cancel">ยกเลิก</button>
          <button class="ev-btn-primary" id="pf-save">บันทึก</button>
        </div>
      `;
    }
    overlay.innerHTML = `<div class="ev-modal" id="pf-modal-box" style="max-width:400px;">${bodyHtml()}</div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    const box = document.getElementById('pf-modal-box');
    box.querySelectorAll('[data-pname]').forEach(inp=> inp.oninput = ()=>{ draft[inp.dataset.pname].name = inp.value; });
    box.querySelectorAll('[data-pshare]').forEach(inp=> inp.oninput = ()=>{ draft[inp.dataset.pshare].share = parseFloat(inp.value)||0; });
    box.querySelector('#pf-cancel').onclick = ()=>overlay.remove();
    box.querySelector('#pf-save').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังบันทึก...', async ()=>{
        partners = draft;
        await savePartners();
        overlay.remove();
        render();
        toast('บันทึกการตั้งค่าหุ้นส่วนแล้ว');
      });
    };
  }

  // ============ EVENT MODAL ============
  function openEventModal(id){
    const e = id ? events.find(x=>x.id===id) : null;
    const isClosed = e && e.status==='closed';

    if(isClosed){ renderClosedView(e); return; }

    const orderSummary = computeOrderSummary(e?e.id:null);
    const state = computeLedgerState();
    const draft = {
      name: e?e.name:'',
      location: e?(e.location||''):'',
      date: e?e.date:new Date().toISOString().slice(0,10),
      note: e?(e.note||''):'',
      bowlsSold: orderSummary.totalBowls,
      cashRevenue: e?e.cashRevenue:'',
      transferRevenue: e?e.transferRevenue:'',
      rawIngredients: (e && e.rawIngredients && e.rawIngredients.length) ? JSON.parse(JSON.stringify(e.rawIngredients)) :
        (ingredientsMaster.filter(m=>m.active!==false).length ? ingredientsMaster.filter(m=>m.active!==false) : DEFAULT_INGREDIENTS.map(n=>({name:n}))).map(m=>({id:uid('ing'), name:m.name, quantity:(m.default_quantity||m.defaultQty)||'', unit:m.default_unit||m.unit||'', price:''})),
      usage: e && e.usage ? JSON.parse(JSON.stringify(e.usage)) : [],
      otherCosts: (e && e.otherCosts && e.otherCosts.length) ? JSON.parse(JSON.stringify(e.otherCosts)) :
        otherCostsMaster.filter(c=>c.active!==false).map(c=>({id:uid('oc'), description:c.name, amount:c.default_amount||''})),
    };

    function ensureAutoRows(){
      relevantAutoSupplyIds(orderSummary).forEach(id=>{
        const existing = draft.usage.find(u=>u.itemId===id && u.auto);
        if(existing){
          if(!existing.removed) existing.qty = computeAutoSupplyQty(id, orderSummary);
        }else{
          draft.usage.push({itemId:id, qty:computeAutoSupplyQty(id, orderSummary), auto:true, removed:false});
        }
      });
    }
    function recalcAuto(){ ensureAutoRows(); }
    ensureAutoRows();

    const overlay = document.createElement('div');
    overlay.className='ev-overlay';

    function computeCosts(){
      const suppliesCost = draft.usage.filter(u=>!u.removed).reduce((s,u)=> s+Number(u.qty||0)*avgCostFor(u.itemId,state), 0);
      const ingredientsCost = draft.rawIngredients.reduce((s,i)=>s+Number(i.price||0),0);
      const otherCost = draft.otherCosts.reduce((s,c)=>s+Number(c.amount||0),0);
      const totalCost = suppliesCost+ingredientsCost+otherCost;
      const cash = Number(draft.cashRevenue)||0;
      const transfer = Number(draft.transferRevenue)||0;
      const revenue = cash+transfer;
      const profit = revenue-totalCost;
      const systemRevenue = orderSummary.totalRevenue;
      const diff = revenue-systemRevenue;
      return {suppliesCost, ingredientsCost, otherCost, totalCost, cash, transfer, revenue, profit, systemRevenue, diff};
    }

    function reconcileHtml(c){
      const ok = Math.abs(c.diff) < 0.01;
      return `ยอดจากออเดอร์: ฿${fmtMoney(c.systemRevenue)} — นับได้จริง: ฿${fmtMoney(c.revenue)}
        ${ok ? '<span style="color:var(--green);font-weight:600;">✓ ตรงกัน</span>' : `<span style="color:var(--coral);font-weight:600;">ต่างกัน ฿${fmtMoney(Math.abs(c.diff))} ${c.diff<0?'(ขาด)':'(เกิน)'}</span>`}`;
    }

    function usageRowHtml(u){
      const m = master.find(x=>x.id===u.itemId);
      const cost = Number(u.qty||0)*avgCostFor(u.itemId,state);
      return `
        <div class="ev-usage-row" data-usage-item="${u.itemId}">
          <span class="ev-usage-name">${escapeHtml(m?m.name:'(ไม่พบรายการ)')}</span>
          ${u.auto?'<span class="ev-usage-auto">อัตโนมัติ</span>':''}
          <span class="ev-usage-qty"><input type="number" min="0" step="0.01" data-usage-qty="${u.itemId}" value="${u.qty}"></span>
          <span class="ev-usage-cost">฿${fmtMoney(cost)}</span>
          <button class="ev-usage-del" data-usage-del="${u.itemId}" title="เอาออก">${iconTrash()}</button>
        </div>
      `;
    }

    function bodyHtml(){
      const c = computeCosts();
      const activeUsage = draft.usage.filter(u=>!u.removed);
      const availableToAdd = master.filter(m=> !activeUsage.find(u=>u.itemId===m.id));
      return `
        <h2>${e?'แก้ไขรอบขาย':'เพิ่มรอบขายใหม่'}</h2>
        <div class="ev-field">
          <label>ชื่อรอบขาย (ไม่บังคับ — ถ้าไม่ระบุจะใช้วันที่แทน)</label>
          <input id="ef-name" value="${escapeHtml(draft.name)}" placeholder="เช่น ขายวันเสาร์ที่ตลาด, งานบุญวัด">
        </div>
        <div class="ev-field">
          <label>สถานที่ขาย</label>
          <input id="ef-location" value="${escapeHtml(draft.location)}" placeholder="เช่น ตลาดนัดหน้าหมู่บ้าน, หน้าบ้าน">
        </div>
        <div class="ev-field"><label>วันที่</label><input id="ef-date" type="date" value="${draft.date}"></div>

        <h3>ยอดขายจากออเดอร์ (ดึงอัตโนมัติ ไม่ต้องกรอกเอง)</h3>
        <div class="ev-hint">นับเฉพาะออเดอร์ที่ไม่ได้ยกเลิกในรอบนี้ แยกตามเมนู</div>
        <div class="ev-summary" style="margin-bottom:14px;">
          ${orderSummary.rows.length===0 ? '<div class="ev-summary-row"><span>ยังไม่มีออเดอร์ในรอบนี้</span><span class="val">-</span></div>' :
            orderSummary.rows.map(r=>`<div class="ev-summary-row"><span>${escapeHtml(r.name)} × ${fmtNum(r.qty)}</span><span class="val">฿${fmtMoney(r.revenue)}</span></div>`).join('')}
          <div class="ev-summary-total"><span>รวม ${fmtNum(orderSummary.totalBowls)} ชาม</span><span class="val">฿${fmtMoney(orderSummary.totalRevenue)}</span></div>
        </div>

        <h3>เช็คยอดเงินจริง</h3>
        <div class="ev-hint">กรอกยอดที่นับ/แสกนได้จริง ระบบจะเทียบกับยอดจากออเดอร์ด้านบนให้อัตโนมัติ</div>
        <div class="ev-row2">
          <div class="ev-field"><label>เงินสดที่นับได้จริง (บาท)</label><input id="ef-cash" type="number" min="0" step="0.01" value="${draft.cashRevenue}" placeholder="0.00"></div>
          <div class="ev-field"><label>เงินโอน/แสกนที่ได้จริง (บาท)</label><input id="ef-transfer" type="number" min="0" step="0.01" value="${draft.transferRevenue}" placeholder="0.00"></div>
        </div>
        <div class="ev-revenue-total" id="ef-reconcile">${reconcileHtml(c)}</div>
        <div class="ev-field"><label>หมายเหตุ</label><textarea id="ef-note" placeholder="รายละเอียดเพิ่มเติม">${escapeHtml(draft.note)}</textarea></div>

        <h3>วัตถุดิบประกอบอาหาร</h3>
        <div class="ev-hint">ซื้อเป็นรอบๆ ไม่ปนกับรอบอื่น — ระบุจำนวนที่ใช้และราคาที่จ่ายจริงในรอบนี้</div>
        <div id="ef-ing-list">
          ${draft.rawIngredients.map(i=>`
            <div class="ev-ing-row" data-ing-item="${i.id}">
              <span class="ev-ing-name"><input data-ing-name="${i.id}" value="${escapeHtml(i.name)}" placeholder="ชื่อวัตถุดิบ"></span>
              <span class="ev-ing-qty"><input type="number" min="0" step="0.01" data-ing-qty="${i.id}" value="${i.quantity}" placeholder="จำนวน"></span>
              <span class="ev-ing-unit"><input data-ing-unit="${i.id}" value="${escapeHtml(i.unit||'')}" placeholder="หน่วย"></span>
              <span class="ev-ing-price"><input type="number" min="0" step="0.01" data-ing-price="${i.id}" value="${i.price}" placeholder="ราคา"></span>
              <button class="ev-usage-del" data-ing-del="${i.id}" title="ลบ">${iconTrash()}</button>
            </div>
          `).join('')}
        </div>
        <button type="button" class="ev-mini-add" id="ef-add-ing">+ เพิ่มวัตถุดิบอื่น</button>

        <h3>วัตถุดิบจาก Supplies</h3>
        <div class="ev-hint">รายการ "ผันแปรตามชาม" คำนวณอัตโนมัติจากจำนวนชาม แก้ตัวเลขเองได้ถ้าต้องการ</div>
        <div id="ef-usage-list">
          ${activeUsage.length===0?'<div style="font-size:12.5px;color:var(--ink-soft);padding:6px 0;">ยังไม่มีรายการวัตถุดิบ</div>':activeUsage.map(usageRowHtml).join('')}
        </div>
        ${availableToAdd.length>0?`
        <select id="ef-add-item" style="margin-top:8px;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;">
          <option value="">+ เลือกวัตถุดิบเพิ่ม...</option>
          ${availableToAdd.map(m=>`<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('')}
        </select>
        `:''}

        <h3>ค่าใช้จ่ายอื่นๆ</h3>
        <div class="ev-hint">เช่น ค่าแรง ค่าเดินทาง ค่าเช่าที่ (ไม่รวมวัตถุดิบ)</div>
        <div id="ef-cost-list">
          ${draft.otherCosts.length===0?'<div style="font-size:12.5px;color:var(--ink-soft);padding:6px 0;">ยังไม่มีรายการ</div>':draft.otherCosts.map(c=>`
            <div class="ev-cost-row" data-cost-item="${c.id}">
              <span class="ev-cost-desc"><input data-cost-desc="${c.id}" value="${escapeHtml(c.description)}" placeholder="รายการ"></span>
              <span class="ev-cost-amt"><input type="number" min="0" step="0.01" data-cost-amt="${c.id}" value="${c.amount}" placeholder="0.00"></span>
              <button class="ev-usage-del" data-cost-del="${c.id}" title="ลบ">${iconTrash()}</button>
            </div>
          `).join('')}
        </div>
        <button type="button" class="ev-mini-add" id="ef-add-cost">+ เพิ่มค่าใช้จ่าย</button>

        <div class="ev-summary" id="ef-cost-summary">
          <div class="ev-summary-row"><span>ต้นทุนวัตถุดิบประกอบอาหาร</span><span class="val">฿${fmtMoney(c.ingredientsCost)}</span></div>
          <div class="ev-summary-row"><span>ต้นทุนวัตถุดิบจาก Supplies</span><span class="val">฿${fmtMoney(c.suppliesCost)}</span></div>
          <div class="ev-summary-row"><span>ค่าใช้จ่ายอื่นๆ</span><span class="val">฿${fmtMoney(c.otherCost)}</span></div>
          <div class="ev-summary-row"><span>รายได้รวม (สด ฿${fmtMoney(c.cash)} + โอน ฿${fmtMoney(c.transfer)})</span><span class="val">฿${fmtMoney(c.revenue)}</span></div>
          <div class="ev-summary-total"><span>กำไรสุทธิ (ประมาณการ)</span><span class="val">฿${fmtMoney(c.profit)}</span></div>
          <div class="ev-summary-split">${partners.map(p=>`${escapeHtml(p.name)}: ฿${fmtMoney(c.profit*p.share/100)} (${p.share}%)`).join(' · ')}</div>
        </div>

        <div class="ev-modal-actions">
          <button class="ev-btn-secondary" id="ef-cancel">ยกเลิก</button>
          ${e?`<button class="ev-btn-danger" id="ef-delete" style="flex:0 0 auto;">${iconTrash()} ลบร่าง</button>`:''}
          <button class="ev-btn-primary" id="ef-save">บันทึกร่าง</button>
          <button class="ev-btn-close" id="ef-close-round">${iconCheck()} ปิดรอบขายนี้</button>
        </div>
      `;
    }

    function captureDraft(box){
      draft.name = box.querySelector('#ef-name').value;
      draft.location = box.querySelector('#ef-location').value;
      draft.date = box.querySelector('#ef-date').value;
      draft.note = box.querySelector('#ef-note').value;
      draft.cashRevenue = box.querySelector('#ef-cash').value;
      draft.transferRevenue = box.querySelector('#ef-transfer').value;
      box.querySelectorAll('[data-ing-name]').forEach(inp=>{
        const row = draft.rawIngredients.find(i=>i.id===inp.dataset.ingName);
        if(row) row.name = inp.value;
      });
      box.querySelectorAll('[data-ing-qty]').forEach(inp=>{
        const row = draft.rawIngredients.find(i=>i.id===inp.dataset.ingQty);
        if(row) row.quantity = inp.value;
      });
      box.querySelectorAll('[data-ing-unit]').forEach(inp=>{
        const row = draft.rawIngredients.find(i=>i.id===inp.dataset.ingUnit);
        if(row) row.unit = inp.value;
      });
      box.querySelectorAll('[data-ing-price]').forEach(inp=>{
        const row = draft.rawIngredients.find(i=>i.id===inp.dataset.ingPrice);
        if(row) row.price = parseFloat(inp.value)||0;
      });
      box.querySelectorAll('[data-usage-qty]').forEach(inp=>{
        const row = draft.usage.find(u=>u.itemId===inp.dataset.usageQty);
        if(row) row.qty = parseFloat(inp.value)||0;
      });
      box.querySelectorAll('[data-cost-desc]').forEach(inp=>{
        const row = draft.otherCosts.find(c=>c.id===inp.dataset.costDesc);
        if(row) row.description = inp.value;
      });
      box.querySelectorAll('[data-cost-amt]').forEach(inp=>{
        const row = draft.otherCosts.find(c=>c.id===inp.dataset.costAmt);
        if(row) row.amount = parseFloat(inp.value)||0;
      });
    }

    overlay.innerHTML = `<div class="ev-modal" id="ef-modal-box">${bodyHtml()}</div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(ev)=>{ if(ev.target===overlay) overlay.remove(); });

    function rerender(){
      const box = document.getElementById('ef-modal-box');
      box.innerHTML = bodyHtml();
      bindEvents();
    }

    function bindUsageRowEvents(box){
      box.querySelectorAll('[data-usage-qty]').forEach(inp=>{
        inp.oninput = ()=>{
          const row = draft.usage.find(u=>u.itemId===inp.dataset.usageQty);
          if(row){ row.qty = parseFloat(inp.value)||0; row.auto=false; }
        };
        inp.addEventListener('change', rerenderSummaryOnly);
      });
      box.querySelectorAll('[data-usage-del]').forEach(btn=>{
        btn.onclick = ()=>{
          captureDraft(box);
          const row = draft.usage.find(u=>u.itemId===btn.dataset.usageDel);
          if(row) row.removed = true;
          rerender();
        };
      });
    }

    function refreshUsageList(box){
      recalcAuto();
      const listEl = box.querySelector('#ef-usage-list');
      const activeUsage = draft.usage.filter(u=>!u.removed);
      listEl.innerHTML = activeUsage.length===0
        ? '<div style="font-size:12.5px;color:var(--ink-soft);padding:6px 0;">ยังไม่มีรายการวัตถุดิบ</div>'
        : activeUsage.map(usageRowHtml).join('');
      bindUsageRowEvents(box);
      rerenderSummaryOnly();
    }

    function bindEvents(){
      const box = document.getElementById('ef-modal-box');
      box.querySelector('#ef-cancel').onclick = ()=>overlay.remove();
      const deleteBtn = box.querySelector('#ef-delete');
      if(deleteBtn) deleteBtn.onclick = ()=>confirmDeleteEvent(e, overlay);
      box.querySelector('#ef-cash').oninput = ()=>{ draft.cashRevenue = box.querySelector('#ef-cash').value; rerenderSummaryOnly(); };
      box.querySelector('#ef-transfer').oninput = ()=>{ draft.transferRevenue = box.querySelector('#ef-transfer').value; rerenderSummaryOnly(); };
      box.querySelectorAll('[data-ing-name]').forEach(inp=> inp.oninput = ()=>{
        const row = draft.rawIngredients.find(i=>i.id===inp.dataset.ingName);
        if(row) row.name = inp.value;
      });
      box.querySelectorAll('[data-ing-qty]').forEach(inp=> inp.oninput = ()=>{
        const row = draft.rawIngredients.find(i=>i.id===inp.dataset.ingQty);
        if(row) row.quantity = inp.value;
      });
      box.querySelectorAll('[data-ing-unit]').forEach(inp=> inp.oninput = ()=>{
        const row = draft.rawIngredients.find(i=>i.id===inp.dataset.ingUnit);
        if(row) row.unit = inp.value;
      });
      box.querySelectorAll('[data-ing-price]').forEach(inp=> inp.oninput = ()=>{
        const row = draft.rawIngredients.find(i=>i.id===inp.dataset.ingPrice);
        if(row) row.price = parseFloat(inp.value)||0;
        rerenderSummaryOnly();
      });
      box.querySelectorAll('[data-ing-del]').forEach(btn=> btn.onclick = ()=>{
        captureDraft(box);
        draft.rawIngredients = draft.rawIngredients.filter(i=>i.id!==btn.dataset.ingDel);
        rerender();
      });
      box.querySelector('#ef-add-ing').onclick = ()=>{
        captureDraft(box);
        draft.rawIngredients.push({id:uid('ing'), name:'', quantity:'', unit:'', price:''});
        rerender();
      };
      bindUsageRowEvents(box);
      const addItemSel = box.querySelector('#ef-add-item');
      if(addItemSel) addItemSel.onchange = ()=>{
        captureDraft(box);
        const itemId = addItemSel.value;
        if(!itemId) return;
        const existing = draft.usage.find(u=>u.itemId===itemId);
        if(existing){ existing.removed=false; existing.auto=false; }
        else{ draft.usage.push({itemId, qty:0, auto:false, removed:false}); }
        rerender();
      };
      box.querySelector('#ef-add-cost').onclick = ()=>{
        captureDraft(box);
        draft.otherCosts.push({id:uid('c'), description:'', amount:0});
        rerender();
      };
      box.querySelectorAll('[data-cost-desc]').forEach(inp=> inp.oninput = ()=>{
        const row = draft.otherCosts.find(c=>c.id===inp.dataset.costDesc);
        if(row) row.description = inp.value;
      });
      box.querySelectorAll('[data-cost-amt]').forEach(inp=> inp.oninput = ()=>{
        const row = draft.otherCosts.find(c=>c.id===inp.dataset.costAmt);
        if(row) row.amount = parseFloat(inp.value)||0;
        rerenderSummaryOnly();
      });
      box.querySelectorAll('[data-cost-del]').forEach(btn=> btn.onclick = ()=>{
        captureDraft(box);
        draft.otherCosts = draft.otherCosts.filter(c=>c.id!==btn.dataset.costDel);
        rerender();
      });

      box.querySelector('#ef-save').onclick = (ev2)=>{
        withLoading(ev2.currentTarget, 'กำลังบันทึก...', async ()=>{
          captureDraft(box);
          if(!draft.date){ toast('กรุณาระบุวันที่'); throw new Error('validation'); }
          const finalName = draft.name.trim() || defaultEventName(draft.date);
          const payload = {
            id: e?e.id:uid('ev'),
            status:'open',
            name: finalName,
            location: draft.location.trim(),
            date: draft.date,
            note: draft.note.trim(),
            bowlsSold: parseFloat(draft.bowlsSold)||0,
            cashRevenue: parseFloat(draft.cashRevenue)||0,
            transferRevenue: parseFloat(draft.transferRevenue)||0,
            rawIngredients: draft.rawIngredients,
            usage: draft.usage,
            otherCosts: draft.otherCosts,
          };
          if(e){ events[events.findIndex(x=>x.id===e.id)] = payload; } else{ events.push(payload); }
          await saveEvents();
          overlay.remove();
          render();
          toast('บันทึกร่างแล้ว');
        });
      };

      box.querySelector('#ef-close-round').onclick = ()=>{
        captureDraft(box);
        if(!draft.date){ toast('กรุณาระบุวันที่'); return; }
        if(!draft.name.trim()) draft.name = defaultEventName(draft.date);
        if(e){
          const unserved = orders.filter(o=> o.eventId===e.id && (o.status==='pending' || o.status==='ready'));
          if(unserved.length>0){
            toast(`ยังมีออเดอร์ที่ยังไม่เสิร์ฟ ${unserved.length} รายการ — เสิร์ฟให้ครบก่อนถึงจะปิดรอบได้`);
            return;
          }
        }
        confirmCloseRound(e, draft, overlay);
      };
    }

    function rerenderSummaryOnly(){
      const box = document.getElementById('ef-modal-box');
      const c = computeCosts();
      const summary = box.querySelector('#ef-cost-summary');
      if(summary){
        summary.innerHTML = `
          <div class="ev-summary-row"><span>ต้นทุนวัตถุดิบประกอบอาหาร</span><span class="val">฿${fmtMoney(c.ingredientsCost)}</span></div>
          <div class="ev-summary-row"><span>ต้นทุนวัตถุดิบจาก Supplies</span><span class="val">฿${fmtMoney(c.suppliesCost)}</span></div>
          <div class="ev-summary-row"><span>ค่าใช้จ่ายอื่นๆ</span><span class="val">฿${fmtMoney(c.otherCost)}</span></div>
          <div class="ev-summary-row"><span>รายได้รวม (สด ฿${fmtMoney(c.cash)} + โอน ฿${fmtMoney(c.transfer)})</span><span class="val">฿${fmtMoney(c.revenue)}</span></div>
          <div class="ev-summary-total"><span>กำไรสุทธิ (ประมาณการ)</span><span class="val">฿${fmtMoney(c.profit)}</span></div>
          <div class="ev-summary-split">${partners.map(p=>`${escapeHtml(p.name)}: ฿${fmtMoney(c.profit*p.share/100)} (${p.share}%)`).join(' · ')}</div>
        `;
      }
      const reconcileEl = box.querySelector('#ef-reconcile');
      if(reconcileEl) reconcileEl.innerHTML = reconcileHtml(c);
    }

    bindEvents();
    document.getElementById('ef-modal-box').querySelector('#ef-name').focus();
  }

  function confirmCloseRound(existingEvent, draft, parentOverlay){
    const overlay = document.createElement('div');
    overlay.className='ev-overlay';
    overlay.innerHTML = `
      <div class="ev-modal" style="max-width:400px;">
        <h2>ยืนยันปิดรอบขาย</h2>
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 20px;">
          ระบบจะ<b style="color:var(--ink);">ตัดสต๊อกวัตถุดิบ</b>ตามรายการที่ใช้ในรอบนี้ และล็อกตัวเลขต้นทุน/กำไรของรอบนี้ไว้
          หลังปิดรอบแล้วจะแก้ไขไม่ได้จนกว่าจะ "เปิดรอบใหม่อีกครั้ง" ต้องการดำเนินการต่อหรือไม่?
        </p>
        <div class="ev-modal-actions">
          <button class="ev-btn-secondary" id="cc-cancel">ยกเลิก</button>
          <button class="ev-btn-close" id="cc-confirm">ยืนยันปิดรอบ</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#cc-cancel').onclick = ()=>overlay.remove();
    overlay.querySelector('#cc-confirm').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังปิดรอบ...', async ()=>{
        const state = computeLedgerState();
        const activeUsage = draft.usage.filter(u=>!u.removed && Number(u.qty||0)>0);
        const eventId = existingEvent?existingEvent.id:uid('ev');
        const suppliesCost = activeUsage.reduce((s,u)=> s+Number(u.qty)*avgCostFor(u.itemId,state), 0);
        const ingredientsCost = draft.rawIngredients.reduce((s,i)=>s+Number(i.price||0),0);
        const otherCost = draft.otherCosts.reduce((s,c)=>s+Number(c.amount||0),0);
        const totalCost = suppliesCost+ingredientsCost+otherCost;
        const cash = parseFloat(draft.cashRevenue)||0;
        const transfer = parseFloat(draft.transferRevenue)||0;
        const revenue = cash+transfer;
        const profit = revenue-totalCost;
        const bowls = parseFloat(draft.bowlsSold)||0;

        activeUsage.forEach(u=>{
          transactions.push({
            id: uid('t'), type:'out', itemId:u.itemId, date:draft.date,
            quantity:Number(u.qty), unitCost:0,
            note:`ตัดจากรอบขาย: ${draft.name.trim()}`, eventId,
          });
        });

        const payload = {
          id: eventId, status:'closed', closedAt: new Date().toISOString(),
          name: draft.name.trim(), location: draft.location.trim(), date: draft.date, note: draft.note.trim(),
          bowlsSold: bowls, cashRevenue: cash, transferRevenue: transfer,
          rawIngredients: draft.rawIngredients,
          usage: draft.usage, otherCosts: draft.otherCosts,
          finalRevenue: revenue, finalCashRevenue: cash, finalTransferRevenue: transfer,
          finalCost: totalCost, finalProfit: profit, finalBowls: bowls,
        };
        if(existingEvent){ events[events.findIndex(x=>x.id===existingEvent.id)] = payload; }
        else{ events.push(payload); }

        await saveTx();
        await saveEvents();
        overlay.remove();
        parentOverlay.remove();
        render();
        toast('ปิดรอบขายและตัดสต๊อกเรียบร้อยแล้ว');
      });
    };
  }

  function renderClosedView(e){
    const ingredientsCost = (e.rawIngredients||[]).reduce((s,i)=>s+Number(i.price||0),0);
    const otherCost = (e.otherCosts||[]).reduce((s,c)=>s+Number(c.amount||0),0);
    const suppliesCost = e.finalCost - ingredientsCost - otherCost;
    const orderSummary = computeOrderSummary(e.id);
    const actualTotal = Number(e.finalCashRevenue||0)+Number(e.finalTransferRevenue||0);
    const diff = actualTotal - orderSummary.totalRevenue;
    const diffOk = Math.abs(diff) < 0.01;
    const overlay = document.createElement('div');
    overlay.className='ev-overlay';
    overlay.innerHTML = `
      <div class="ev-modal" id="cv-modal-box">
        <h2>${escapeHtml(e.name)}</h2>
        <div class="ev-closed-banner">✓ ปิดรอบแล้วเมื่อ ${fmtDate(e.closedAt)} — สต๊อกถูกตัดเรียบร้อย ตัวเลขถูกล็อกไว้</div>
        ${e.location?`<div class="ev-field"><label>สถานที่ขาย</label><input value="${escapeHtml(e.location)}" disabled></div>`:''}
        <div class="ev-field"><label>วันที่ขาย</label><input value="${fmtDate(e.date)}" disabled></div>

        <h3>ยอดขายแยกตามเมนู</h3>
        <div class="ev-summary" style="margin-bottom:14px;">
          ${orderSummary.rows.length===0 ? '<div class="ev-summary-row"><span>ไม่มีข้อมูลออเดอร์ผูกกับรอบนี้</span><span class="val">-</span></div>' :
            orderSummary.rows.map(r=>`<div class="ev-summary-row"><span>${escapeHtml(r.name)} × ${fmtNum(r.qty)}</span><span class="val">฿${fmtMoney(r.revenue)}</span></div>`).join('')}
          <div class="ev-summary-total"><span>รวม ${fmtNum(orderSummary.totalBowls)} ชาม</span><span class="val">฿${fmtMoney(orderSummary.totalRevenue)}</span></div>
        </div>

        ${e.note?`<div class="ev-field"><label>หมายเหตุ</label><textarea disabled>${escapeHtml(e.note)}</textarea></div>`:''}
        <div class="ev-summary">
          <div class="ev-summary-row"><span>รับเงินสด / เงินโอน (นับจริง)</span><span class="val">฿${fmtMoney(e.finalCashRevenue)} / ฿${fmtMoney(e.finalTransferRevenue)}</span></div>
          <div class="ev-summary-row"><span>เทียบกับยอดออเดอร์</span><span class="val">${diffOk?'<span style="color:var(--green);">✓ ตรงกัน</span>':`<span style="color:var(--coral);">ต่าง ฿${fmtMoney(Math.abs(diff))} ${diff<0?'(ขาด)':'(เกิน)'}</span>`}</span></div>
          <div class="ev-summary-row"><span>ต้นทุนวัตถุดิบประกอบอาหาร</span><span class="val">฿${fmtMoney(ingredientsCost)}</span></div>
          <div class="ev-summary-row"><span>ต้นทุนวัตถุดิบจาก Supplies</span><span class="val">฿${fmtMoney(suppliesCost)}</span></div>
          <div class="ev-summary-row"><span>ค่าใช้จ่ายอื่นๆ</span><span class="val">฿${fmtMoney(otherCost)}</span></div>
          <div class="ev-summary-total"><span>กำไรสุทธิ</span><span class="val">฿${fmtMoney(e.finalProfit)}</span></div>
          <div class="ev-summary-split">${partners.map(p=>`${escapeHtml(p.name)}: ฿${fmtMoney(e.finalProfit*p.share/100)} (${p.share}%)`).join(' · ')}</div>
        </div>
        <div class="ev-modal-actions">
          <button class="ev-btn-secondary" id="cv-cancel">ปิดหน้าต่าง</button>
          <button class="ev-btn-secondary" id="cv-export-jpg">🖼️ ดาวน์โหลด JPG</button>
          <button class="ev-btn-secondary" id="cv-export-pdf">📄 ดาวน์โหลด PDF</button>
          <button class="ev-btn-danger" id="cv-delete">${iconTrash()} ลบรอบนี้</button>
          <button class="ev-btn-primary" id="cv-reopen">${iconRefresh()} เปิดรอบใหม่อีกครั้ง</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(ev)=>{ if(ev.target===overlay) overlay.remove(); });
    overlay.querySelector('#cv-cancel').onclick = ()=>overlay.remove();
    overlay.querySelector('#cv-reopen').onclick = ()=>confirmReopen(e, overlay);
    overlay.querySelector('#cv-delete').onclick = ()=>confirmDeleteEvent(e, overlay);
    overlay.querySelector('#cv-export-jpg').onclick = (ev)=> exportReceipt(e, orderSummary, {ingredientsCost, suppliesCost, otherCost, diff, diffOk}, 'jpg', ev.currentTarget);
    overlay.querySelector('#cv-export-pdf').onclick = (ev)=> exportReceipt(e, orderSummary, {ingredientsCost, suppliesCost, otherCost, diff, diffOk}, 'pdf', ev.currentTarget);
  }

  function buildReceiptNode(e, orderSummary, costs){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:380px;background:#FEF8E6;font-family:"IBM Plex Mono",monospace;color:#21201C;padding:24px;box-sizing:border-box;';
    const line = ()=>'<div style="border-top:1.5px dashed #21201C;margin:10px 0;"></div>';
    wrap.innerHTML = `
      <div style="text-align:center;margin-bottom:10px;">
        <div style="font-family:'Jao October','Archivo Black',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.01em;">CONGEE IS HAPPY</div>
        <div style="font-size:11px;color:#4A4940;margin-top:2px;">ใบสรุปยอดขายรอบขาย</div>
      </div>
      ${line()}
      <div style="font-size:13px;line-height:1.9;">
        <div><b>รอบ:</b> ${escapeHtml(e.name)}</div>
        ${e.location?`<div><b>สถานที่:</b> ${escapeHtml(e.location)}</div>`:''}
        <div><b>วันที่:</b> ${fmtDate(e.date)}</div>
        <div><b>ปิดรอบเมื่อ:</b> ${fmtDate(e.closedAt)}</div>
      </div>
      ${line()}
      <div style="font-size:13px;">
        ${orderSummary.rows.length===0 ? '<div style="display:flex;justify-content:space-between;"><span>ไม่มีข้อมูลออเดอร์</span></div>' :
          orderSummary.rows.map(r=>`<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>${escapeHtml(r.name)} x${fmtNum(r.qty)}</span><span>฿${fmtMoney(r.revenue)}</span></div>`).join('')}
      </div>
      ${line()}
      <div style="font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;">
        <span>รวม ${fmtNum(orderSummary.totalBowls)} ชาม</span><span>฿${fmtMoney(orderSummary.totalRevenue)}</span>
      </div>
      ${line()}
      <div style="font-size:12.5px;line-height:1.9;">
        <div style="display:flex;justify-content:space-between;"><span>เงินสดที่นับได้จริง</span><span>฿${fmtMoney(e.finalCashRevenue)}</span></div>
        <div style="display:flex;justify-content:space-between;"><span>เงินโอน/แสกนที่ได้จริง</span><span>฿${fmtMoney(e.finalTransferRevenue)}</span></div>
        <div style="display:flex;justify-content:space-between;"><span>เทียบกับยอดออเดอร์</span><span>${costs.diffOk?'✓ ตรงกัน':`ต่าง ฿${fmtMoney(Math.abs(costs.diff))} ${costs.diff<0?'(ขาด)':'(เกิน)'}`}</span></div>
      </div>
      ${line()}
      <div style="font-size:12.5px;line-height:1.9;">
        <div style="display:flex;justify-content:space-between;"><span>ต้นทุนวัตถุดิบประกอบอาหาร</span><span>฿${fmtMoney(costs.ingredientsCost)}</span></div>
        <div style="display:flex;justify-content:space-between;"><span>ต้นทุนวัตถุดิบจาก Supplies</span><span>฿${fmtMoney(costs.suppliesCost)}</span></div>
        <div style="display:flex;justify-content:space-between;"><span>ค่าใช้จ่ายอื่นๆ</span><span>฿${fmtMoney(costs.otherCost)}</span></div>
      </div>
      ${line()}
      <div style="font-size:16px;font-weight:700;display:flex;justify-content:space-between;">
        <span>กำไรสุทธิ</span><span>฿${fmtMoney(e.finalProfit)}</span>
      </div>
      <div style="font-size:11.5px;color:#4A4940;margin-top:6px;">
        ${partners.map(p=>`${escapeHtml(p.name)}: ฿${fmtMoney(e.finalProfit*p.share/100)} (${p.share}%)`).join(' &middot; ')}
      </div>
      ${line()}
      <div style="text-align:center;font-size:12px;color:#4A4940;margin-top:8px;">ขอบคุณค่ะ 🥣</div>
    `;
    document.body.appendChild(wrap);
    return wrap;
  }

  async function exportReceipt(e, orderSummary, costs, format, btn){
    if(typeof html2canvas === 'undefined'){ toast('โหลดตัวช่วยสร้างไฟล์ไม่สำเร็จ ลองเช็คอินเทอร์เน็ตแล้วลองใหม่'); return; }
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'กำลังสร้างไฟล์...';
    const node = buildReceiptNode(e, orderSummary, costs);
    try{
      const canvas = await html2canvas(node, {backgroundColor:'#FEF8E6', scale:2});
      const fname = 'receipt-' + (e.name||'round').replace(/[^\w\u0E00-\u0E7F-]+/g,'_') + '-' + (e.date||'');
      if(format==='jpg'){
        const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
        const a = document.createElement('a');
        a.href = dataUrl; a.download = fname + '.jpg';
        document.body.appendChild(a); a.click(); a.remove();
      }else{
        const { jsPDF } = window.jspdf;
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        const pdfWidth = 100; // มม. — ขนาดใกล้เคียงใบเสร็จจริง
        const pdfHeight = pdfWidth * canvas.height / canvas.width;
        const pdf = new jsPDF({ unit:'mm', format:[pdfWidth, pdfHeight] });
        pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(fname + '.pdf');
      }
    }catch(err){
      toast('สร้างไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง');
    }finally{
      node.remove();
      btn.disabled = false; btn.textContent = orig;
    }
  }

  function confirmReopen(e, parentOverlay){
    const overlay = document.createElement('div');
    overlay.className='ev-overlay';
    overlay.innerHTML = `
      <div class="ev-modal" style="max-width:400px;">
        <h2>ยืนยันเปิดรอบใหม่</h2>
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 20px;">
          รายการตัดสต๊อกที่เกิดจากรอบ <b style="color:var(--ink);">${escapeHtml(e.name)}</b> จะถูกลบออก
          (คืนสต๊อกกลับ) และรอบนี้จะกลับไปเป็นสถานะ "กำลังขาย" เพื่อแก้ไขได้อีกครั้ง ต้องการดำเนินการต่อหรือไม่?
        </p>
        <div class="ev-modal-actions">
          <button class="ev-btn-secondary" id="rc-cancel">ยกเลิก</button>
          <button class="ev-btn-close" id="rc-confirm">ยืนยันเปิดรอบใหม่</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(ev)=>{ if(ev.target===overlay) overlay.remove(); });
    overlay.querySelector('#rc-cancel').onclick = ()=>overlay.remove();
    overlay.querySelector('#rc-confirm').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังเปิดรอบ...', async ()=>{
        transactions = transactions.filter(t=>t.eventId!==e.id);
        const idx = events.findIndex(x=>x.id===e.id);
        events[idx] = Object.assign({}, e, {status:'open', closedAt:null, finalRevenue:undefined, finalCashRevenue:undefined, finalTransferRevenue:undefined, finalCost:undefined, finalProfit:undefined, finalBowls:undefined});
        await saveTx();
        await saveEvents();
        overlay.remove();
        parentOverlay.remove();
        render();
        toast('เปิดรอบใหม่แล้ว แก้ไขได้ตามต้องการ');
      });
    };
  }

  function confirmDeleteEvent(e, parentOverlay){
    const overlay = document.createElement('div');
    overlay.className='ev-overlay';
    const hasTx = e.status==='closed';
    overlay.innerHTML = `
      <div class="ev-modal" style="max-width:400px;">
        <h2>ยืนยันการลบ</h2>
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 16px;">
          ต้องการลบรอบขาย <b style="color:var(--ink);">${escapeHtml(e.name)}</b> ใช่หรือไม่?
        </p>
        ${hasTx?`<p style="font-size:12.5px;color:var(--red);margin:-8px 0 16px;">รอบนี้ปิดแล้ว การลบจะคืนสต๊อกที่เคยตัดไปด้วย</p>`:''}
        <div class="ev-modal-actions">
          <button class="ev-btn-secondary" id="ed-cancel">ยกเลิก</button>
          <button class="ev-btn-danger" id="ed-confirm">ลบรอบขายนี้</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(ev)=>{ if(ev.target===overlay) overlay.remove(); });
    overlay.querySelector('#ed-cancel').onclick = ()=>overlay.remove();
    overlay.querySelector('#ed-confirm').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังลบ...', async ()=>{
        // คืนสต๊อก: ลบ transaction ที่ตัดไปตอนปิดรอบนี้ทิ้ง (moving average จะคำนวณคืนให้เอง)
        transactions = transactions.filter(t=>t.eventId!==e.id);
        events = events.filter(x=>x.id!==e.id);
        await saveTx();
        await saveEvents();
        // ตัดการเชื่อมออเดอร์ของรอบนี้ออกอย่างชัดเจน (เก็บไว้เป็นข้อมูลดิบ ไม่ลบ แต่จะไม่โผล่ในหน้าจอที่ยึดตามรอบที่เปิดอยู่อีก)
        try{
          await window.authReady;
          await window.supabaseClient.from('orders').update({event_id: null}).eq('event_id', e.id);
        }catch(err){ /* ไม่ critical ถ้า fail — FK constraint จะจัดการให้ตอน DB ลบ event อยู่แล้ว */ }
        orders.forEach(o=>{ if(o.eventId===e.id) o.eventId=null; });
        overlay.remove();
        parentOverlay.remove();
        render();
        toast('ลบรอบขายแล้ว');
      });
    };
  }

  loadAll();
})();

</script>
<script>

(function(){
  const POLL_MS = 8000;

  let orders = [];
  let menu = [];
  let events = [];
  let busy = false;
  let filter = 'active'; // active | served | all
  const root = document.getElementById('od-root');

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
  function fmtMoney(n){ return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function uid(p){ return (p||'x')+Date.now()+Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
  function iconPlus(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'; }
  function iconTrash(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>'; }

  async function loadAll(){
    try{
      const rows = await window.dbLoadTable('orders');
      const children = await window.dbLoadOrderChildren();
      orders = rows.map(r=>({
        id: r.id, queueNumber: r.queue_number, note: r.note, status: r.status,
        createdAt: r.created_at, eventId: r.event_id,
        items: children.items.filter(i=>i.order_id===r.id).map(i=>({id:i.id, menuItemId:i.menu_item_id, name:i.name, price:i.price, qty:i.qty})),
        editHistory: children.history.filter(h=>h.order_id===r.id).map(h=>({at:h.at, summary:h.summary})),
      }));
    }catch(e){ orders = []; }
    try{
      const rows = await window.dbLoadTable('menu_items');
      menu = rows.map(r=>({id:r.id, name:r.name, price:r.price, active:r.active}));
    }catch(e){ menu = []; }
    try{
      const rows = await window.dbLoadTable('events');
      events = rows.map(r=>({id:r.id, status:r.status, name:r.name, location:r.location, date:r.date}));
    }catch(e){ events = []; }
    render();
  }
  async function saveOrders(){
    try{
      const rows = orders.map(o=>({
        id: o.id, queue_number: o.queueNumber, note: o.note || '', status: o.status,
        created_at: o.createdAt, event_id: o.eventId || null
      }));
      const ok = await window.dbSyncTable('orders', 'id', rows);
      if(!ok){ toast('บันทึกไม่สำเร็จ'); return; }
      const orderIds = orders.map(o=>o.id);
      const itemRows = [], historyRows = [];
      orders.forEach(o=>{
        (o.items||[]).forEach(i=> itemRows.push({
          id: i.id || uid('oi'), order_id: o.id, menu_item_id: i.menuItemId || null, name: i.name, price: Number(i.price)||0, qty: Number(i.qty)||0
        }));
        (o.editHistory||[]).forEach(h=> historyRows.push({
          id: h.id || uid('oh'), order_id: o.id, at: h.at, summary: h.summary || ''
        }));
      });
      await window.dbSyncOrderChildren(orderIds, itemRows, historyRows);
    }catch(e){ toast('เกิดข้อผิดพลาดในการบันทึก'); }
  }
  async function saveEvents(){
    try{
      const rows = events.map(e=>({
        id: e.id, status: e.status, name: e.name, location: e.location || '', date: e.date || null
      }));
      const ok = await window.dbSyncTable('events', 'id', rows);
      return !!ok;
    }catch(e){ return false; }
  }
  function peekNextQueueNumber(){
    const round = getActiveRound();
    if(!round) return 1;
    const inRound = orders.filter(o=>o.eventId===round.id);
    const maxQ = inRound.reduce((m,o)=>Math.max(m, Number(o.queueNumber)||0), 0);
    return maxQ + 1;
  }
  function toast(msg){ const t=document.createElement('div'); t.className='od-toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
  function withLoading(btn, loadingText, fn){
    if(btn.disabled) return;
    const original = btn.innerHTML;
    btn.disabled = true; btn.style.opacity='.6'; btn.style.cursor='wait'; btn.textContent = loadingText;
    Promise.resolve(fn()).catch(()=>{}).finally(()=>{
      if(document.body.contains(btn)){ btn.disabled=false; btn.style.opacity=''; btn.style.cursor=''; btn.innerHTML=original; }
    });
  }

  function getActiveRound(){
    return events.find(e=>e.status==='open') || null;
  }

  function orderTotal(o){ return (o.items||[]).reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0); }

  function filteredOrders(){
    const round = getActiveRound();
    const scoped = round ? orders.filter(o=> o.eventId===round.id) : [];
    if(filter==='active') return scoped.filter(o=>o.status!=='served'&&o.status!=='cancelled')
      .sort((a,b)=> (a.status==='ready'?1:0)-(b.status==='ready'?1:0) || a.queueNumber-b.queueNumber);
    if(filter==='served') return scoped.filter(o=>o.status==='served').sort((a,b)=>b.queueNumber-a.queueNumber);
    return scoped.sort((a,b)=>b.queueNumber-a.queueNumber);
  }

  function render(){
    const round = getActiveRound();
    if(!round){
      root.innerHTML = `
        <div class="od-header">
          <h1 class="od-title">สั่งอาหาร</h1>
          <div class="od-sub">รับออเดอร์ลูกค้า แจกเลขคิวอัตโนมัติ</div>
        </div>
        <div class="od-noround">
          <p>ยังไม่ได้เปิดรอบขายวันนี้ — ต้องเปิดรอบก่อนถึงจะเริ่มรับออเดอร์ได้</p>
          <button class="od-open-round-btn" id="od-open-round">🟢 เปิดรอบบิลวันนี้</button>
        </div>
      `;
      document.getElementById('od-open-round').onclick = openRoundModal;
      return;
    }

    const list = filteredOrders();
    root.innerHTML = `
      <div class="od-header">
        <h1 class="od-title">สั่งอาหาร</h1>
        <div class="od-sub">รับออเดอร์ลูกค้า แจกเลขคิวอัตโนมัติ</div>
      </div>
      <div class="od-round-banner">
        <div class="od-round-info">
          <div class="od-round-name">${escapeHtml(round.name)}</div>
          <div class="od-round-loc">${round.location?('📍 '+escapeHtml(round.location)):'ยังไม่ระบุสถานที่'}</div>
        </div>
        <span class="od-round-tag">รอบเปิดอยู่</span>
      </div>
      <button class="od-add" id="od-add-btn">${iconPlus()} รับออเดอร์ใหม่</button>
      <div class="od-toolbar">
        <button class="od-chip ${filter==='active'?'active':''}" data-f="active">กำลังดำเนินการ</button>
        <button class="od-chip ${filter==='served'?'active':''}" data-f="served">เสิร์ฟแล้ววันนี้</button>
        <button class="od-chip ${filter==='all'?'active':''}" data-f="all">ทั้งหมดวันนี้</button>
      </div>
      <div class="od-list">
        ${list.length===0?`<div class="od-empty">ไม่มีออเดอร์ในหมวดนี้</div>`:list.map(orderRow).join('')}
      </div>
    `;
    document.getElementById('od-add-btn').onclick = ()=>openOrderModal(null);
    root.querySelectorAll('[data-f]').forEach(b=> b.onclick = ()=>{ filter=b.dataset.f; render(); });
    root.querySelectorAll('[data-serve]').forEach(b=> b.onclick = (ev)=>{
      withLoading(ev.currentTarget, '...', async ()=>{
        busy = true;
        const o = orders.find(x=>x.id===b.dataset.serve);
        if(o) o.status='served';
        await saveOrders();
        busy = false;
        render();
        toast('ปิดรายการแล้ว');
      });
    });
    root.querySelectorAll('[data-editorder]').forEach(b=> b.onclick = ()=>openOrderModal(b.dataset.editorder));
    root.querySelectorAll('[data-cancelorder]').forEach(b=> b.onclick = ()=>confirmCancelOrder(b.dataset.cancelorder));
    root.querySelectorAll('[data-history]').forEach(b=> b.onclick = ()=>showHistory(b.dataset.history));
  }

  function orderRow(o){
    const itemsSummary = (o.items||[]).map(i=>`${escapeHtml(i.name)}${i.qty>1?' x'+i.qty:''}`).join(', ');
    const canEdit = o.status==='pending' || o.status==='ready';
    const hasHistory = (o.editHistory||[]).length>0;
    return `
      <div class="od-row ${o.status==='ready'?'ready':''} ${o.status==='cancelled'?'cancelled':''}">
        <div class="od-qnum">#${o.queueNumber}</div>
        <div class="od-row-main">
          <div class="od-row-items">${itemsSummary||'(ไม่มีรายการ)'}</div>
          ${o.note?`<div class="od-row-note">📝 ${escapeHtml(o.note)}</div>`:''}
          <div class="od-row-time">${fmtTime(o.createdAt)}</div>
        </div>
        <div class="od-row-total">฿${fmtMoney(orderTotal(o))}</div>
        <span class="od-tag ${o.status}">${o.status==='ready'?'พร้อมเสิร์ฟ':o.status==='served'?'เสิร์ฟแล้ว':o.status==='cancelled'?'ยกเลิกแล้ว':'กำลังทำ'}</span>
        ${hasHistory?`<button class="od-tag edited" data-history="${o.id}" style="cursor:pointer;">แก้ไขแล้ว</button>`:''}
        <div class="od-row-actions">
          ${o.status==='ready'?`<button class="od-serve-btn" data-serve="${o.id}">เสิร์ฟแล้ว</button>`:''}
          ${canEdit?`<button class="od-icon-btn" data-editorder="${o.id}">แก้ไข</button>`:''}
          ${canEdit?`<button class="od-icon-btn" data-cancelorder="${o.id}">ยกเลิก</button>`:''}
        </div>
      </div>
    `;
  }

  function showHistory(id){
    const o = orders.find(x=>x.id===id); if(!o) return;
    const overlay = document.createElement('div'); overlay.className='od-overlay';
    overlay.innerHTML = `
      <div class="od-modal" style="max-width:400px;">
        <h2>ประวัติการแก้ไข — คิว #${o.queueNumber}</h2>
        ${(o.editHistory||[]).map(h=>`<div class="od-history-item">🕐 ${fmtTime(h.at)} — ${escapeHtml(h.summary)}</div>`).join('')}
        <div class="od-modal-actions"><button class="od-btn-secondary" id="oh-close" style="flex:1;">ปิด</button></div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#oh-close').onclick = ()=>overlay.remove();
  }

  function confirmCancelOrder(id){
    const o = orders.find(x=>x.id===id); if(!o) return;
    const overlay = document.createElement('div'); overlay.className='od-overlay';
    overlay.innerHTML = `
      <div class="od-modal" style="max-width:400px;">
        <h2>ยืนยันยกเลิกออเดอร์</h2>
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 20px;">ต้องการยกเลิกออเดอร์คิว <b style="color:var(--ink);">#${o.queueNumber}</b> ใช่หรือไม่?</p>
        <div class="od-modal-actions">
          <button class="od-btn-secondary" id="oc-cancel">ไม่ยกเลิก</button>
          <button class="od-btn-danger" id="oc-confirm" style="flex:1;">ยืนยันยกเลิก</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#oc-cancel').onclick = ()=>overlay.remove();
    overlay.querySelector('#oc-confirm').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังยกเลิก...', async ()=>{
        busy = true;
        o.status='cancelled';
        o.editHistory = o.editHistory||[];
        o.editHistory.push({at:new Date().toISOString(), summary:'ยกเลิกออเดอร์'});
        await saveOrders();
        busy = false;
        overlay.remove();
        render();
        toast('ยกเลิกออเดอร์แล้ว');
      });
    };
  }

  function openRoundModal(){
    const overlay = document.createElement('div'); overlay.className='od-overlay';
    overlay.innerHTML = `
      <div class="od-modal" style="max-width:420px;">
        <h2>เปิดรอบบิลวันนี้</h2>
        <div class="od-field"><label>สถานที่ขาย</label><input id="or-location" placeholder="เช่น หน้าปากซอย, ตลาดนัด"></div>
        <div class="od-modal-actions">
          <button class="od-btn-secondary" id="or-cancel">ยกเลิก</button>
          <button class="od-btn-primary" id="or-confirm">เปิดรอบขาย</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#or-cancel').onclick = ()=>overlay.remove();
    overlay.querySelector('#or-confirm').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังเปิดรอบ...', async ()=>{
        busy = true;
        // Guard: re-check for any already-open round (in case another device opened one, or local state drifted)
        const existingOpen = events.find(e=>e.status==='open');
        if(existingOpen){
          busy = false;
          overlay.remove();
          render();
          toast('มีรอบขายเปิดอยู่แล้ว — ปิดรอบเดิมก่อนถึงจะเปิดรอบใหม่ได้');
          return;
        }
        const location = overlay.querySelector('#or-location').value.trim();
        const today = todayStr();
        const name = 'รอบขาย ' + new Date(today).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'});
        const newEvent = {
          id: uid('ev'), status:'open', name, date: today, location, note:'',
          bowlsSold:0, cashRevenue:0, transferRevenue:0,
          rawIngredients: [], usage: [], otherCosts: [],
        };
        events.push(newEvent);
        const ok = await saveEvents();
        busy = false;
        overlay.remove();
        if(!ok){
          events = events.filter(ev=>ev.id!==newEvent.id);
          render();
          toast('เปิดรอบไม่สำเร็จ ลองใหม่อีกครั้ง (เช็คว่าตาราง events มีคอลัมน์ location แล้วหรือยัง)');
          return;
        }
        render();
        toast('เปิดรอบขายวันนี้แล้ว');
      });
    };
    overlay.querySelector('#or-location').focus();
  }

  function openOrderModal(existingId){
    const existing = existingId ? orders.find(x=>x.id===existingId) : null;
    const activeMenu = menu.filter(m=>m.active);
    let items = existing ? JSON.parse(JSON.stringify(existing.items||[])) : [];
    let note = existing ? (existing.note||'') : '';
    let showCustom = false;
    const overlay = document.createElement('div');
    overlay.className='od-overlay';

    function cartTotal(){ return items.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0); }

    function bodyHtml(){
      return `
        <h2>${existing?'แก้ไขออเดอร์ คิว #'+existing.queueNumber:'รับออเดอร์ใหม่'}</h2>
        <div class="od-menu-grid">
          ${activeMenu.map(m=>`
            <button type="button" class="od-menu-btn" data-menu="${m.id}">
              <span style="flex:1;min-width:0;">${escapeHtml(m.name)}</span><span class="price">฿${fmtMoney(m.price)}</span><span class="plus">+</span>
            </button>
          `).join('')}
          ${!showCustom?`<button type="button" class="od-menu-btn" id="od-show-custom"><span>+ รายการอื่น (ระบุเอง)</span></button>`:''}
        </div>
        ${showCustom?`
        <div class="od-custom-add">
          <input id="od-custom-name" placeholder="ระบุชื่อรายการ">
          <input id="od-custom-price" type="number" min="0" step="1" placeholder="ราคา" style="max-width:90px;">
          <button type="button" id="od-custom-confirm">เพิ่ม</button>
        </div>`:''}
        <div class="od-cart" id="od-cart-list">
          ${items.length===0?`<div class="od-cart-empty">แตะเมนูด้านบนเพื่อเพิ่มรายการ</div>`:items.map(it=>`
            <div class="od-cart-line" data-cart-item="${it.id}">
              <span class="od-cart-name">${escapeHtml(it.name)}</span>
              <span class="od-cart-price">฿${fmtMoney(it.price)}/หน่วย</span>
              <div class="od-cart-qty-ctrl">
                <button type="button" class="od-cart-qty-btn" data-qtyminus="${it.id}">−</button>
                <span class="od-cart-qty-num">${it.qty}</span>
                <button type="button" class="od-cart-qty-btn" data-qtyplus="${it.id}">+</button>
              </div>
              <button type="button" class="od-cart-del" data-cartdel="${it.id}" title="ลบ">${iconTrash()}</button>
            </div>
          `).join('')}
        </div>
        ${items.length>0?`<div class="od-cart-total"><span>รวมทั้งบิล</span><span class="val">฿${fmtMoney(cartTotal())}</span></div>`:''}
        <div class="od-field">
          <label>หมายเหตุ (ไม่บังคับ)</label>
          <textarea id="od-note" placeholder="เช่น ไม่ใส่ผัก, เผ็ดน้อย">${escapeHtml(note)}</textarea>
        </div>
        <div class="od-modal-actions">
          <button class="od-btn-secondary" id="od-cancel">ยกเลิก</button>
          <button class="od-btn-primary" id="od-confirm">${existing?'บันทึกการแก้ไข':'ยืนยันออเดอร์ & แจกเลขคิว'}</button>
        </div>
      `;
    }

    function addItem(menuId){
      const m = activeMenu.find(x=>x.id===menuId);
      if(!m) return;
      const existingLine = items.find(i=>i.menuItemId===m.id);
      if(existingLine) existingLine.qty += 1;
      else items.push({id:uid('i'), menuItemId:m.id, name:m.name, price:m.price, qty:1});
    }
    function addCustomItem(name, price){
      items.push({id:uid('i'), menuItemId:null, name, price:price||0, qty:1});
    }

    overlay.innerHTML = `<div class="od-modal" id="od-modal-box">${bodyHtml()}</div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });

    function captureNote(box){
      const noteEl = box.querySelector('#od-note');
      if(noteEl) note = noteEl.value;
    }

    function rerender(){
      const box = document.getElementById('od-modal-box');
      box.innerHTML = bodyHtml();
      bindEvents();
    }

    function bindEvents(){
      const box = document.getElementById('od-modal-box');
      box.querySelector('#od-cancel').onclick = ()=>overlay.remove();
      box.querySelectorAll('[data-menu]').forEach(btn=> btn.onclick = ()=>{
        captureNote(box);
        addItem(btn.dataset.menu);
        rerender();
      });
      const showCustomBtn = box.querySelector('#od-show-custom');
      if(showCustomBtn) showCustomBtn.onclick = ()=>{ captureNote(box); showCustom=true; rerender(); box.querySelector('#od-custom-name').focus(); };
      const customConfirmBtn = box.querySelector('#od-custom-confirm');
      if(customConfirmBtn) customConfirmBtn.onclick = ()=>{
        captureNote(box);
        const val = box.querySelector('#od-custom-name').value.trim();
        const price = parseFloat(box.querySelector('#od-custom-price').value)||0;
        if(val){ addCustomItem(val, price); showCustom=false; }
        rerender();
      };
      box.querySelectorAll('[data-qtyplus]').forEach(btn=> btn.onclick = ()=>{
        captureNote(box);
        const it = items.find(x=>x.id===btn.dataset.qtyplus);
        if(it) it.qty += 1;
        rerender();
      });
      box.querySelectorAll('[data-qtyminus]').forEach(btn=> btn.onclick = ()=>{
        captureNote(box);
        const it = items.find(x=>x.id===btn.dataset.qtyminus);
        if(it){ it.qty -= 1; if(it.qty<=0) items = items.filter(x=>x.id!==it.id); }
        rerender();
      });
      box.querySelectorAll('[data-cartdel]').forEach(btn=> btn.onclick = ()=>{
        captureNote(box);
        items = items.filter(x=>x.id!==btn.dataset.cartdel);
        rerender();
      });
      box.querySelector('#od-confirm').onclick = (ev)=>{
        withLoading(ev.currentTarget, 'กำลังบันทึก...', async ()=>{
          captureNote(box);
          if(items.length===0){ toast('กรุณาเลือกรายการอาหารอย่างน้อย 1 อย่าง'); throw new Error('validation'); }
          busy = true;
          const round = getActiveRound();
          if(existing){
            const oldSummary = (existing.items||[]).map(i=>`${i.name} x${i.qty}`).join(', ');
            const newSummary = items.map(i=>`${i.name} x${i.qty}`).join(', ');
            existing.editHistory = existing.editHistory||[];
            if(oldSummary!==newSummary || (existing.note||'')!==note.trim()){
              existing.editHistory.push({at:new Date().toISOString(), summary:`เปลี่ยนจาก [${oldSummary}] เป็น [${newSummary}]`});
            }
