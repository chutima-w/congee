            existing.items = items.map(i=>({menuItemId:i.menuItemId||null, name:i.name, price:i.price, qty:i.qty}));
            existing.note = note.trim();
            await saveOrders();
            busy = false;
            overlay.remove();
            render();
            toast('บันทึกการแก้ไขแล้ว');
          }else{
            const qNum = peekNextQueueNumber();
            const order = {
              id: uid('o'), queueNumber: qNum, items: items.map(i=>({menuItemId:i.menuItemId||null, name:i.name, price:i.price, qty:i.qty})),
              note: note.trim(), status:'pending', createdAt: new Date().toISOString(),
              eventId: round?round.id:null, editHistory:[],
            };
            orders.push(order);
            await saveOrders();
            busy = false;
            overlay.remove();
            render();
            showQueueConfirm(qNum);
          }
        });
      };
    }
    bindEvents();
  }

  function showQueueConfirm(qNum){
    const overlay = document.createElement('div');
    overlay.className = 'qc-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(23,19,15,.45);display:flex;align-items:center;justify-content:center;z-index:60;';
    overlay.innerHTML = `
      <div class="od-confirm-modal">
        <div class="od-confirm-label">คิวของคุณคือ</div>
        <div class="od-confirm-num">#${qNum}</div>
        <button class="od-confirm-ok" id="qc-ok">ตกลง</button>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#qc-ok').onclick = ()=>overlay.remove();
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
  }

  loadAll();
  setInterval(()=>{ if(!busy) loadAll(); }, POLL_MS);
})();

</script>
<script>

(function(){
  const POLL_MS = 6000;
  let orders = [];
  let events = [];
  const root = document.getElementById('kt-root');

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
  function uid(p){ return (p||'x')+Date.now()+Math.random().toString(36).slice(2,7); }
  function toast(msg){ const t=document.createElement('div'); t.className='kt-toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

  async function loadAll(){
    try{
      const rows = await window.dbLoadTable('orders');
      const children = await window.dbLoadOrderChildren();
      orders = rows.map(r=>({
        id: r.id, queueNumber: r.queue_number, note: r.note, status: r.status,
        createdAt: r.created_at, eventId: r.event_id,
        items: children.items.filter(i=>i.order_id===r.id).map(i=>({id:i.id, menuItemId:i.menu_item_id, name:i.name, price:i.price, qty:i.qty})),
        editHistory: children.history.filter(h=>h.order_id===r.id).map(h=>({at:h.at, summary:h.summary})),
      }));
    }catch(e){ orders = []; }
    try{
      const rows = await window.dbLoadTable('events');
      events = rows.map(r=>({id:r.id, status:r.status}));
    }catch(e){ events = []; }
    render();
  }
  async function saveOrders(){
    try{
      const rows = orders.map(o=>({
        id: o.id, queue_number: o.queueNumber, note: o.note || '', status: o.status,
        created_at: o.createdAt, event_id: o.eventId || null
      }));
      const ok = await window.dbSyncTable('orders', 'id', rows);
      if(!ok){ toast('บันทึกไม่สำเร็จ'); return; }
      const orderIds = orders.map(o=>o.id);
      const itemRows = [], historyRows = [];
      orders.forEach(o=>{
        (o.items||[]).forEach(i=> itemRows.push({
          id: i.id || uid('oi'), order_id: o.id, menu_item_id: i.menuItemId || null, name: i.name, price: Number(i.price)||0, qty: Number(i.qty)||0
        }));
        (o.editHistory||[]).forEach(h=> historyRows.push({
          id: h.id || uid('oh'), order_id: o.id, at: h.at, summary: h.summary || ''
        }));
      });
      await window.dbSyncOrderChildren(orderIds, itemRows, historyRows);
    }catch(e){ toast('เกิดข้อผิดพลาดในการบันทึก'); }
  }
  function withLoading(btn, loadingText, fn){
    if(btn.disabled) return;
    const original = btn.innerHTML;
    btn.disabled = true; btn.style.opacity='.6'; btn.style.cursor='wait'; btn.textContent = loadingText;
    Promise.resolve(fn()).catch(()=>{}).finally(()=>{
      if(document.body.contains(btn)){ btn.disabled=false; btn.style.opacity=''; btn.style.cursor=''; btn.innerHTML=original; }
    });
  }

  function getActiveRound(){
    return events.find(e=>e.status==='open') || null;
  }

  function render(){
    const round = getActiveRound();
    const todays = round ? orders.filter(o=> o.eventId===round.id) : [];
    const pending = todays.filter(o=>o.status==='pending').sort((a,b)=>a.queueNumber-b.queueNumber);
    const ready = todays.filter(o=>o.status==='ready').sort((a,b)=>a.queueNumber-b.queueNumber);

    root.innerHTML = `
      <div class="kt-header">
        <h1 class="kt-title">ออเดอร์ในครัว</h1>
        <div class="kt-sub">${round?'ทำตามคิว กดพร้อมเสิร์ฟเมื่อเสร็จ':'ยังไม่มีรอบขายเปิดอยู่ตอนนี้'}</div>
        ${pending.length>0?`<div class="kt-count-badge">🔥 ${pending.length} ออเดอร์รอทำ</div>`:''}
      </div>

      <div class="kt-rail-wrap">
        <div class="kt-rail-label">รางออเดอร์ — รอทำ (เรียงตามคิว)</div>
        <div class="kt-rail-bar"></div>
        ${pending.length===0?`<div class="kt-empty" style="margin-top:16px;">ไม่มีออเดอร์รอทำ 🎉</div>`:`
        <div class="kt-rail-track">
          ${pending.map(ticketHtml).join('')}
        </div>`}
      </div>

      <div class="kt-rail-label">พร้อมเสิร์ฟ — รอพนักงานหน้าร้านมารับ</div>
      <div class="kt-ready-section">
        ${ready.length===0?`<div class="kt-empty">ยังไม่มีออเดอร์ที่พร้อมเสิร์ฟ</div>`:ready.map(readyRow).join('')}
      </div>
    `;

    root.querySelectorAll('[data-ready]').forEach(btn=> btn.onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังบันทึก...', async ()=>{
        const o = orders.find(x=>x.id===btn.dataset.ready);
        if(o) o.status='ready';
        await saveOrders();
        render();
        toast(`คิว #${o?o.queueNumber:''} พร้อมเสิร์ฟแล้ว`);
      });
    });
  }

  function ticketHtml(o){
    const itemLines = (o.items||[]).map(i=>`<div class="kt-ticket-item-line"><span>${escapeHtml(i.name)}</span><span>x${i.qty}</span></div>`).join('');
    const edited = (o.editHistory||[]).length>0;
    return `
      <div class="kt-ticket">
        <div class="kt-ticket-qnum">#${o.queueNumber} ${edited?'<span style="font-size:10px;background:#F3E4C8;color:#8B5E3C;border:1.5px solid var(--ink);border-radius:4px;padding:1px 5px;vertical-align:middle;">แก้ไขแล้ว</span>':''}</div>
        <div class="kt-ticket-items">${itemLines}</div>
        ${o.note?`<div class="kt-ticket-note">📝 ${escapeHtml(o.note)}</div>`:''}
        <div class="kt-ticket-time">${fmtTime(o.createdAt)}</div>
        <button class="kt-ready-btn" data-ready="${o.id}">✓ พร้อมเสิร์ฟ</button>
      </div>
    `;
  }

  function readyRow(o){
    const itemsSummary = (o.items||[]).map(i=>`${escapeHtml(i.name)}${i.qty>1?' x'+i.qty:''}`).join(', ');
    return `
      <div class="kt-ready-row">
        <span class="kt-ready-qnum">#${o.queueNumber}</span>
        <span class="kt-ready-items">${itemsSummary}</span>
        <span class="kt-ready-tag">รอรับ</span>
      </div>
    `;
  }

  loadAll();
  setInterval(loadAll, POLL_MS);
})();

</script>
<script>

(function(){
  let menu = [];
  let supplies = [];
  let recipes = []; // menu_supply_usage rows: {menuItemId, supplyItemId, qtyPerUnit}
  const root = document.getElementById('mn-root');
  function uid(){ return 'mn'+Date.now()+Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function fmtMoney(n){ return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function iconPencil(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>'; }
  function iconTrash(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>'; }
  function iconPlus(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'; }
  function toast(msg){ const t=document.createElement('div'); t.className='mn-toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
  function withLoading(btn, txt, fn){
    if(btn.disabled) return;
    const orig = btn.innerHTML; btn.disabled=true; btn.style.opacity='.6'; btn.textContent=txt;
    Promise.resolve(fn()).catch(()=>{}).finally(()=>{ if(document.body.contains(btn)){ btn.disabled=false; btn.style.opacity=''; btn.innerHTML=orig; } });
  }
  async function loadAll(){
    try{
      const rows = await window.dbLoadTable('menu_items');
      menu = rows.map(r=>({id:r.id, name:r.name, price:r.price, active:r.active, sortOrder:r.sort_order||0}));
      menu.sort((a,b)=>a.sortOrder-b.sortOrder);
    }catch(e){ menu=[]; }
    try{
      const rows = await window.dbLoadTable('supplies_master');
      supplies = rows.map(r=>({id:r.id, name:r.name, unit:r.unit}));
    }catch(e){ supplies=[]; }
    try{
      const rows = await window.dbLoadTable('menu_supply_usage');
      recipes = rows.map(r=>({menuItemId:r.menu_item_id, supplyItemId:r.supply_item_id, qtyPerUnit:r.qty_per_unit}));
    }catch(e){ recipes=[]; }
    render();
  }
  async function saveMenu(){
    try{
      const rows = menu.map((m,idx)=>({id:m.id, name:m.name, price:Number(m.price)||0, active:!!m.active, sort_order: idx}));
      const ok = await window.dbSyncTable('menu_items', 'id', rows);
      if(!ok) toast('บันทึกไม่สำเร็จ');
    }catch(e){ toast('เกิดข้อผิดพลาด'); }
  }
  async function saveRecipe(menuItemId, rows){
    try{
      await window.authReady;
      const sb = window.supabaseClient;
      await sb.from('menu_supply_usage').delete().eq('menu_item_id', menuItemId);
      const clean = rows.filter(r=>Number(r.qtyPerUnit)>0).map(r=>({menu_item_id:menuItemId, supply_item_id:r.supplyItemId, qty_per_unit:Number(r.qtyPerUnit)}));
      if(clean.length){
        const { error } = await sb.from('menu_supply_usage').insert(clean);
        if(error){ toast('บันทึกสูตรไม่สำเร็จ'); return false; }
      }
      recipes = recipes.filter(r=>r.menuItemId!==menuItemId).concat(
        rows.filter(r=>Number(r.qtyPerUnit)>0).map(r=>({menuItemId, supplyItemId:r.supplyItemId, qtyPerUnit:Number(r.qtyPerUnit)}))
      );
      return true;
    }catch(e){ toast('เกิดข้อผิดพลาด'); return false; }
  }
  function iconDrag(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>'; }
  let dragId = null;
  function render(){
    const list = menu; // ลำดับตามที่ผู้ใช้จัดไว้ ไม่เรียงตาม active/ชื่ออัตโนมัติ
    root.innerHTML = `
      <div class="mn-header">
        <h1 class="mn-title">เมนู</h1>
        <div class="mn-sub">จัดการรายการอาหาร ราคา และเปิด/ปิดการขาย — ลากที่ไอคอน ⠿ เพื่อจัดลำดับใหม่</div>
      </div>
      <div class="mn-toolbar"><button class="mn-add" id="mn-add-btn">${iconPlus()} เพิ่มเมนู</button></div>
      <div class="mn-list">${list.length===0?`<div class="mn-empty">ยังไม่มีเมนู กด "เพิ่มเมนู" เพื่อเริ่มบันทึก</div>`:list.map(row).join('')}</div>
    `;
    document.getElementById('mn-add-btn').onclick = ()=>openModal(null);
    root.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=>openModal(b.dataset.edit));
    root.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=>confirmDelete(b.dataset.del));
    root.querySelectorAll('[data-toggle]').forEach(inp=> inp.onchange = async ()=>{
      const m = menu.find(x=>x.id===inp.dataset.toggle);
      if(m){ m.active = inp.checked; await saveMenu(); render(); }
    });
    root.querySelectorAll('.mn-row').forEach(rowEl=>{
      rowEl.addEventListener('dragstart', ()=>{ dragId = rowEl.dataset.id; rowEl.classList.add('dragging'); });
      rowEl.addEventListener('dragend', ()=>{ dragId = null; rowEl.classList.remove('dragging'); root.querySelectorAll('.mn-row').forEach(r=>r.classList.remove('drag-over')); });
      rowEl.addEventListener('dragover', (e)=>{ e.preventDefault(); if(rowEl.dataset.id!==dragId) rowEl.classList.add('drag-over'); });
      rowEl.addEventListener('dragleave', ()=>{ rowEl.classList.remove('drag-over'); });
      rowEl.addEventListener('drop', async (e)=>{
        e.preventDefault();
        rowEl.classList.remove('drag-over');
        const targetId = rowEl.dataset.id;
        if(!dragId || dragId===targetId) return;
        const fromIdx = menu.findIndex(x=>x.id===dragId);
        const toIdx = menu.findIndex(x=>x.id===targetId);
        if(fromIdx<0 || toIdx<0) return;
        const [moved] = menu.splice(fromIdx,1);
        menu.splice(toIdx,0,moved);
        await saveMenu();
        render();
      });
    });
  }
  function row(m){
    return `
      <div class="mn-row ${m.active?'':'inactive'}" draggable="true" data-id="${m.id}">
        <span class="mn-drag-handle" title="ลากเพื่อจัดลำดับ" style="cursor:grab;color:var(--ink-soft);display:flex;align-items:center;">${iconDrag()}</span>
        <label class="mn-toggle"><input type="checkbox" data-toggle="${m.id}" ${m.active?'checked':''}><span class="mn-toggle-slider"></span></label>
        <span class="mn-name">${escapeHtml(m.name)}</span>
        <span class="mn-price">฿${fmtMoney(m.price)}</span>
        <span class="mn-row-actions">
          <button class="mn-icon-btn" data-edit="${m.id}">${iconPencil()}</button>
          <button class="mn-icon-btn" data-del="${m.id}">${iconTrash()}</button>
        </span>
      </div>
    `;
  }
  function openModal(id){
    const m = id ? menu.find(x=>x.id===id) : null;
    let recipeDraft = m ? recipes.filter(r=>r.menuItemId===m.id).map(r=>({supplyItemId:r.supplyItemId, qtyPerUnit:r.qtyPerUnit})) : [];
    const overlay = document.createElement('div'); overlay.className='mn-overlay';
    overlay.innerHTML = `
      <div class="mn-modal">
        <h2>${m?'แก้ไขเมนู':'เพิ่มเมนูใหม่'}</h2>
        <div class="mn-field"><label>ชื่อเมนู</label><input id="mf-name" value="${m?escapeHtml(m.name):''}" placeholder="เช่น โจ๊กหมูสับเห็ดหอม"></div>
        <div class="mn-field"><label>ราคา (บาท)</label><input id="mf-price" type="number" min="0" step="1" value="${m?m.price:''}" placeholder="0"></div>
        <div class="mn-field">
          <label>วัตถุดิบที่ใช้ต่อ 1 หน่วยขาย (ไม่บังคับ — ใช้คำนวณสต๊อกอัตโนมัติตอนปิดรอบ)</label>
          <div id="mf-recipe-rows"></div>
          <div style="display:flex;gap:8px;margin-top:6px;">
            <select id="mf-recipe-add" style="flex:1;"><option value="">— เลือกวัตถุดิบเพื่อเพิ่ม —</option></select>
          </div>
        </div>
        <div class="mn-modal-actions">
          <button class="mn-btn-secondary" id="mf-cancel">ยกเลิก</button>
          <button class="mn-btn-primary" id="mf-save">${m?'บันทึกการแก้ไข':'เพิ่มเมนู'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    function renderRecipeRows(){
      const container = overlay.querySelector('#mf-recipe-rows');
      container.innerHTML = recipeDraft.length===0 ? `<div style="font-size:12.5px;color:var(--ink-soft);padding:4px 0;">ยังไม่ได้ระบุวัตถุดิบ</div>` :
        recipeDraft.map(r=>{
          const s = supplies.find(x=>x.id===r.supplyItemId);
          return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="flex:1;font-size:13.5px;">${escapeHtml(s?s.name:'(ไม่พบวัตถุดิบ)')}</span>
            <input type="number" min="0" step="0.01" value="${r.qtyPerUnit}" data-recipe-qty="${r.supplyItemId}" style="width:90px;" placeholder="จำนวน">
            <span style="font-size:12px;color:var(--ink-soft);min-width:30px;">${s?(s.unit||''):''}</span>
            <button type="button" data-recipe-del="${r.supplyItemId}" style="background:none;border:none;color:var(--ink-soft);cursor:pointer;">✕</button>
          </div>`;
        }).join('');
      container.querySelectorAll('[data-recipe-qty]').forEach(inp=>{
        inp.onchange = ()=>{
          const row = recipeDraft.find(r=>r.supplyItemId===inp.dataset.recipeQty);
          if(row) row.qtyPerUnit = parseFloat(inp.value)||0;
        };
      });
      container.querySelectorAll('[data-recipe-del]').forEach(btn=>{
        btn.onclick = ()=>{
          recipeDraft = recipeDraft.filter(r=>r.supplyItemId!==btn.dataset.recipeDel);
          renderRecipeRows();
          renderAddOptions();
        };
      });
    }
    function renderAddOptions(){
      const select = overlay.querySelector('#mf-recipe-add');
      const usedIds = new Set(recipeDraft.map(r=>r.supplyItemId));
      const available = supplies.filter(s=>!usedIds.has(s.id));
      select.innerHTML = `<option value="">— เลือกวัตถุดิบเพื่อเพิ่ม —</option>` +
        available.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
    }
    overlay.querySelector('#mf-recipe-add').onchange = (e)=>{
      const id = e.target.value;
      if(!id) return;
      recipeDraft.push({supplyItemId:id, qtyPerUnit:1});
      renderRecipeRows();
      renderAddOptions();
    };
    renderRecipeRows();
    renderAddOptions();

    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#mf-cancel').onclick = ()=>overlay.remove();
    overlay.querySelector('#mf-save').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังบันทึก...', async ()=>{
        const name = overlay.querySelector('#mf-name').value.trim();
        if(!name){ toast('กรุณาระบุชื่อเมนู'); throw new Error('validation'); }
        const price = parseFloat(overlay.querySelector('#mf-price').value)||0;
        const menuItemId = m?m.id:uid();
        const payload = { id: menuItemId, name, price, active: m?m.active:true };
        if(m){ menu[menu.findIndex(x=>x.id===m.id)] = payload; } else{ menu.push(payload); }
        await saveMenu();
        await saveRecipe(menuItemId, recipeDraft);
        overlay.remove(); render();
        toast(m?'แก้ไขเมนูแล้ว':'เพิ่มเมนูแล้ว');
      });
    };
    overlay.querySelector('#mf-name').focus();
  }
  function confirmDelete(id){
    const m = menu.find(x=>x.id===id); if(!m) return;
    const overlay = document.createElement('div'); overlay.className='mn-overlay';
    overlay.innerHTML = `
      <div class="mn-modal" style="max-width:380px;">
        <h2>ยืนยันการลบ</h2>
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 20px;">ต้องการลบเมนู <b style="color:var(--ink);">${escapeHtml(m.name)}</b> ใช่หรือไม่?</p>
        <div class="mn-modal-actions">
          <button class="mn-btn-secondary" id="md-cancel">ยกเลิก</button>
          <button class="mn-btn-danger" id="md-confirm">ลบเมนู</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#md-cancel').onclick = ()=>overlay.remove();
    overlay.querySelector('#md-confirm').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังลบ...', async ()=>{
        menu = menu.filter(x=>x.id!==id); await saveMenu(); overlay.remove(); render();
        toast('ลบเมนูแล้ว');
      });
    };
  }
  loadAll();
})();

</script>
<script>

(function(){
  let ingredients = [];
  let otherCosts = [];
  const root = document.getElementById('ig-root');
  function uid(p){ return (p||'ig')+Date.now()+Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function fmtMoney(n){ return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function toast(msg){ const t=document.createElement('div'); t.className='ig-toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
  function iconDrag(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>'; }
  let dragIngId = null;

  async function loadAll(){
    try{
      const rows = await window.dbLoadTable('ingredients_master');
      ingredients = rows.map(r=>({id:r.id, name:r.name, active: r.active!==false, sortOrder: r.sort_order||0, unit:r.default_unit||'', defaultQty:r.default_quantity||''}));
      ingredients.sort((a,b)=>a.sortOrder-b.sortOrder);
    }catch(e){ ingredients=[]; }
    try{
      const rows = await window.dbLoadTable('other_costs_master');
      otherCosts = rows.map(r=>({id:r.id, name:r.name, defaultAmount:r.default_amount, active: r.active!==false}));
    }catch(e){ otherCosts=[]; }
    render();
  }
  // บันทึกแล้วโหลดข้อมูลจริงจาก DB กลับมาทันที เพื่อให้เห็นทันทีถ้าบันทึกไม่สำเร็จ
  // (แทนที่จะเชื่อ state ในหน่วยความจำเฉยๆ ซึ่งจะทำให้ของหายตอนรีเฟรชโดยไม่รู้ตัว)
  async function saveIngredients(){
    try{
      const rows = ingredients.map((it,idx)=>({id:it.id, name:it.name, active: it.active!==false, sort_order: idx, default_unit: it.unit||'', default_quantity: Number(it.defaultQty)||0}));
      const ok = await window.dbSyncTable('ingredients_master', 'id', rows);
      if(!ok) toast('บันทึกไม่สำเร็จ');
      await loadAll();
      return ok;
    }catch(e){ toast('เกิดข้อผิดพลาด'); await loadAll(); return false; }
  }
  async function saveOtherCosts(){
    try{
      const rows = otherCosts.map(c=>({id:c.id, name:c.name, default_amount:Number(c.defaultAmount)||0, active: c.active!==false}));
      const ok = await window.dbSyncTable('other_costs_master', 'id', rows);
      if(!ok) toast('บันทึกไม่สำเร็จ');
      await loadAll();
      return ok;
    }catch(e){ toast('เกิดข้อผิดพลาด'); await loadAll(); return false; }
  }

  function render(){
    root.innerHTML = `
      <div class="ig-header">
        <h1 class="ig-title">วัตถุดิบ &amp; ค่าใช้จ่ายอื่นๆ</h1>
        <div class="ig-sub">รายการเหล่านี้จะถูกดึงไปเป็นค่าเริ่มต้นตอนเปิด/ปิดรอบขายที่หน้า Events — ปิด toggle เพื่อซ่อนรายการที่ไม่ได้ใช้แล้ว โดยไม่ต้องลบทิ้ง</div>
      </div>

      <h2 class="ig-section-title">วัตถุดิบประกอบอาหาร</h2>
      <div class="ig-sub" style="margin:-6px 0 10px;">ตั้งหน่วยและปริมาณเริ่มต้นไว้ที่นี่ครั้งเดียว — ตอนเปิดรอบขายที่หน้า Events จะดึงมาเติมให้อัตโนมัติ ไม่ต้องกรอกซ้ำ</div>
      <div class="ig-toolbar">
        <input class="ig-input" id="ig-new-name" placeholder="เช่น ข้าวสาร, หมูสับ, ไข่">
        <input class="ig-input" id="ig-new-qty" type="number" min="0" step="0.01" placeholder="ปริมาณเริ่มต้น" style="max-width:130px;">
        <input class="ig-input" id="ig-new-unit" placeholder="หน่วย เช่น กก., ฟอง" style="max-width:120px;">
        <button class="ig-add" id="ig-add-btn">+ เพิ่ม</button>
      </div>
      <div class="ig-rowlist" id="ig-ing-list">
        ${ingredients.length===0?`<div class="ig-empty">ยังไม่มีรายการ ลองเพิ่มดูได้เลย</div>`:ingredients.map(it=>`
          <div class="ig-item-row ${it.active?'':'inactive'}" draggable="true" data-ing-id="${it.id}">
            <span class="ig-drag-handle" title="ลากเพื่อจัดลำดับ" style="cursor:grab;color:var(--ink-soft);display:flex;align-items:center;">${iconDrag()}</span>
            <label class="ig-toggle"><input type="checkbox" data-ing-toggle="${it.id}" ${it.active?'checked':''}><span class="ig-toggle-slider"></span></label>
            <span class="ig-item-name">${escapeHtml(it.name)}</span>
            <input type="number" min="0" step="0.01" value="${it.defaultQty}" data-ing-qty="${it.id}" placeholder="ปริมาณ" style="width:90px;">
            <input type="text" value="${escapeHtml(it.unit)}" data-ing-unit="${it.id}" placeholder="หน่วย" style="width:90px;">
            <button data-ing-del="${it.id}">✕</button>
          </div>
        `).join('')}
      </div>

      <h2 class="ig-section-title">ค่าใช้จ่ายอื่นๆ (นอกเหนือจากวัตถุดิบ/สต๊อก)</h2>
      <div class="ig-toolbar">
        <input class="ig-input" id="ig-cost-name" placeholder="เช่น ค่าเช่าที่, ค่าแก๊ส, ค่าเดินทาง">
        <input class="ig-input" id="ig-cost-amount" type="number" min="0" step="1" placeholder="จำนวนเงินเริ่มต้น" style="max-width:150px;">
        <button class="ig-add" id="ig-cost-add-btn">+ เพิ่ม</button>
      </div>
      <div class="ig-rowlist">
        ${otherCosts.length===0?`<div class="ig-empty">ยังไม่มีรายการ ลองเพิ่มดูได้เลย</div>`:otherCosts.map(c=>`
          <div class="ig-item-row ${c.active?'':'inactive'}">
            <label class="ig-toggle"><input type="checkbox" data-cost-toggle="${c.id}" ${c.active?'checked':''}><span class="ig-toggle-slider"></span></label>
            <span class="ig-item-name">${escapeHtml(c.name)}</span>
            <span class="ig-item-amount">฿${fmtMoney(c.defaultAmount)}</span>
            <button data-cost-del="${c.id}">✕</button>
          </div>
        `).join('')}
      </div>
    `;

    const nameInput = document.getElementById('ig-new-name');
    const qtyInput = document.getElementById('ig-new-qty');
    const unitInput = document.getElementById('ig-new-unit');
    const addBtn = document.getElementById('ig-add-btn');
    async function addIngredient(){
      const name = nameInput.value.trim();
      if(!name){ toast('กรุณากรอกชื่อวัตถุดิบ'); return; }
      const defaultQty = parseFloat(qtyInput.value)||'';
      const unit = unitInput.value.trim();
      ingredients.push({id:uid('ing'), name, active:true, unit, defaultQty});
      await saveIngredients();
    }
    addBtn.onclick = addIngredient;
    nameInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addIngredient(); } };
    qtyInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addIngredient(); } };
    unitInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addIngredient(); } };
    root.querySelectorAll('[data-ing-qty]').forEach(inp=> inp.onchange = async ()=>{
      const it = ingredients.find(x=>x.id===inp.dataset.ingQty);
      if(it){ it.defaultQty = inp.value; await saveIngredients(); }
    });
    root.querySelectorAll('[data-ing-unit]').forEach(inp=> inp.onchange = async ()=>{
      const it = ingredients.find(x=>x.id===inp.dataset.ingUnit);
      if(it){ it.unit = inp.value.trim(); await saveIngredients(); }
    });
    root.querySelectorAll('[data-ing-del]').forEach(b=> b.onclick = async ()=>{
      ingredients = ingredients.filter(x=>x.id!==b.dataset.ingDel);
      await saveIngredients();
    });
    root.querySelectorAll('[data-ing-toggle]').forEach(inp=> inp.onchange = async ()=>{
      const it = ingredients.find(x=>x.id===inp.dataset.ingToggle);
      if(it){ it.active = inp.checked; await saveIngredients(); }
    });
    root.querySelectorAll('#ig-ing-list .ig-item-row').forEach(rowEl=>{
      rowEl.addEventListener('dragstart', ()=>{ dragIngId = rowEl.dataset.ingId; rowEl.classList.add('dragging'); });
      rowEl.addEventListener('dragend', ()=>{ dragIngId = null; rowEl.classList.remove('dragging'); root.querySelectorAll('#ig-ing-list .ig-item-row').forEach(r=>r.classList.remove('drag-over')); });
      rowEl.addEventListener('dragover', (e)=>{ e.preventDefault(); if(rowEl.dataset.ingId!==dragIngId) rowEl.classList.add('drag-over'); });
      rowEl.addEventListener('dragleave', ()=>{ rowEl.classList.remove('drag-over'); });
      rowEl.addEventListener('drop', async (e)=>{
        e.preventDefault();
        rowEl.classList.remove('drag-over');
        const targetId = rowEl.dataset.ingId;
        if(!dragIngId || dragIngId===targetId) return;
        const fromIdx = ingredients.findIndex(x=>x.id===dragIngId);
        const toIdx = ingredients.findIndex(x=>x.id===targetId);
        if(fromIdx<0 || toIdx<0) return;
        const [moved] = ingredients.splice(fromIdx,1);
        ingredients.splice(toIdx,0,moved);
        await saveIngredients();
      });
    });

    const costNameInput = document.getElementById('ig-cost-name');
    const costAmountInput = document.getElementById('ig-cost-amount');
    const costAddBtn = document.getElementById('ig-cost-add-btn');
    async function addOtherCost(){
      const name = costNameInput.value.trim();
      if(!name){ toast('กรุณากรอกชื่อค่าใช้จ่าย'); return; }
      const amount = parseFloat(costAmountInput.value)||0;
      otherCosts.push({id:uid('oc'), name, defaultAmount:amount, active:true});
      await saveOtherCosts();
    }
    costAddBtn.onclick = addOtherCost;
    costAmountInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addOtherCost(); } };
    costNameInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addOtherCost(); } };
    root.querySelectorAll('[data-cost-del]').forEach(b=> b.onclick = async ()=>{
      otherCosts = otherCosts.filter(x=>x.id!==b.dataset.costDel);
      await saveOtherCosts();
    });
    root.querySelectorAll('[data-cost-toggle]').forEach(inp=> inp.onchange = async ()=>{
      const c = otherCosts.find(x=>x.id===inp.dataset.costToggle);
      if(c){ c.active = inp.checked; await saveOtherCosts(); }
    });
  }
  loadAll();
})();

</script>
<script>

(function(){
  var KEY = 'congee_active_module';
  function applyModule(mod){
    document.querySelectorAll('.app-module').forEach(function(el){
      el.classList.toggle('active', el.id === 'module-'+mod);
    });
    document.querySelectorAll('.app-navbtn').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.module === mod);
    });
  }
  document.querySelectorAll('.app-navbtn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var mod = btn.dataset.module;
      applyModule(mod);
      try{ localStorage.setItem(KEY, mod); }catch(e){}
    });
  });
  try{
    var saved = localStorage.getItem(KEY);
    if(saved){ applyModule(saved); }
  }catch(e){}
})();

// กันหน้าจอเลื่อน (scroll) ตอนมี popup/modal เปิดอยู่ — ทำงานอัตโนมัติกับทุก overlay
// ทั้งที่มีอยู่แล้วและที่จะถูกสร้างเพิ่มในอนาคต ไม่ต้องแก้ทีละหน้า
(function(){
  var OVERLAY_SELECTOR = '.faw-overlay,.sw-overlay,.ev-overlay,.od-overlay,.mn-overlay,.qc-overlay';
  var savedScrollY = 0;
  function isLocked(){ return document.body.classList.contains('congee-scroll-locked'); }
  function update(){
    var hasOverlay = !!document.querySelector(OVERLAY_SELECTOR);
    if(hasOverlay && !isLocked()){
      savedScrollY = window.scrollY || window.pageYOffset || 0;
      document.body.classList.add('congee-scroll-locked');
      document.body.style.position = 'fixed';
      document.body.style.top = (-savedScrollY) + 'px';
      document.body.style.left = '0';
      document.body.style.right = '0';
      document.body.style.width = '100%';
    }else if(!hasOverlay && isLocked()){
      document.body.classList.remove('congee-scroll-locked');
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      document.body.style.width = '';
      window.scrollTo(0, savedScrollY);
    }
  }
  var observer = new MutationObserver(update);
  observer.observe(document.body, {childList:true});
  update();
})();

</script>
