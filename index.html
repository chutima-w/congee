<div id="pin-gate" style="position:fixed;inset:0;z-index:9999;background:#FBF7EF;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;">
  <div style="background:#FFFFFF;border:1px solid #E7DCC9;border-radius:14px;padding:32px 28px;max-width:320px;width:90%;text-align:center;box-sizing:border-box;">

    <button id="pin-submit" style="width:100%;background:#3F7A52;color:#fff;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">เข้าสู่ระบบ</button>

<style>

@import url('https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#FEF8E6;
  --surface:#FFFFFF;
  --ink:#21201C;
  --ink-soft:#4A4940;
  --green:#5E8C42;
  --green-light:#BCD38F;
  --green-soft:#E7EFD8;
  --red:#EE5533;
  --red-soft:#FDE1DA;
  --gold:#FFF3CC;
  --gold-soft:#FFF9E8;
  --coral:#EE5533;
  --coral-soft:#FEC0CD;
  --blue:#ACD3EF;
  --blue-soft:#E3F1FA;
  --border:#21201C;
  --fill-muted:#E3DED2;
  --radius:16px;
  --header-red:#ACD3EF;
}
html{overflow-x:hidden;width:100%;}
html body{
  background-color:var(--bg);
  overflow-x:hidden;
  max-width:100%;
}
h1,h2,h3,h4{font-weight:700;color:var(--ink);}
*{box-sizing:border-box;}
img,svg{max-width:100%;}
body,.faw-root{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;
}
.faw-root{padding:20px 16px 60px;max-width:760px;margin:0 auto;}

.faw-header{margin-bottom:18px;}
.faw-eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:4px;
}
.faw-title{
  font-family:'Taviraj',serif;font-weight:600;font-size:28px;
  margin:0 0 2px;color:var(--ink);
}
.faw-sub{font-size:13px;color:var(--ink-soft);}

/* Receipt summary */
.faw-receipt{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 22px;margin-bottom:22px;
  position:relative;
  background-image:
    radial-gradient(circle at 0 0, transparent 8px, var(--surface) 8.5px) 0 -8px / 100% 100%,
    radial-gradient(circle at 100% 0, transparent 8px, var(--surface) 8.5px);
}
.faw-receipt-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:6px 0;font-size:13.5px;
}
.faw-receipt-row + .faw-receipt-row{border-top:1px dashed var(--border);}
.faw-receipt-row .lbl{color:var(--ink-soft);}
.faw-receipt-row .val{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.faw-receipt-total{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:10px;padding-top:12px;border-top:2px solid var(--ink);
  font-family:'Taviraj',serif;
}
.faw-receipt-total .lbl{font-size:15px;font-weight:600;}
.faw-receipt-total .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--green);}

/* Toolbar */
.faw-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.faw-chip{
  font-size:12.5px;padding:6px 13px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink-soft);cursor:pointer;transition:.15s;
  font-family:'IBM Plex Sans Thai',sans-serif;
}
.faw-chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.faw-search{
  flex:1;min-width:140px;padding:8px 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);font-size:13px;font-family:inherit;color:var(--ink);
}
.faw-search:focus{outline:2px solid var(--gold);outline-offset:1px;}
.faw-add{
  margin-left:auto;background:var(--green);color:#fff;border:none;
  padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;
}
.faw-add:hover{background:#356647;}
.faw-viewtoggle{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface);}
.faw-viewbtn{
  background:none;border:none;padding:8px 11px;cursor:pointer;color:var(--ink-soft);
  display:flex;align-items:center;
}
.faw-viewbtn.active{background:var(--ink);color:var(--bg);}
.faw-viewbtn:first-child{border-right:1px solid var(--border);}
.faw-viewbtn.active:first-child{border-right-color:var(--ink);}

/* Card grid layout */
.faw-list.view-card{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.faw-list.view-card .faw-empty{grid-column:1/-1;}

/* Compact list rows */
.faw-list.view-list{display:flex;flex-direction:column;gap:6px;}
.faw-row{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-left:3px solid var(--border);
  border-radius:8px;padding:9px 12px;font-size:12.5px;flex-wrap:wrap;
}
.faw-row.status-ไม่ใช้งาน{border-left-color:var(--ink-soft);opacity:.6;}
.faw-row-faid{flex:0 0 auto;}
.faw-row-name{flex:1 1 140px;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.faw-row-cat{flex:0 0 90px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.faw-row-status{flex:0 0 auto;}

  align-items:center;gap:4px;padding:6px 0;font-size:12.5px;border-top:1px dashed var(--border);
}
.ev-ing-row:first-child{border-top:none;}
.ev-ing-name input{width:100%;padding:5px 6px;font-size:11.5px;}
.ev-ing-qty input{width:100%;padding:5px 4px;font-size:11px;text-align:center;}
.ev-ing-unit input{width:100%;padding:5px 4px;font-size:11px;text-align:center;}
.ev-ing-price input{width:100%;padding:5px 6px;font-size:11.5px;text-align:right;}
.ev-ing-row .ev-usage-del{padding:2px;}
.ev-revenue-total{font-size:12.5px;color:var(--ink-soft);margin:-8px 0 12px;text-align:right;}
.ev-revenue-total b{color:var(--ink);font-family:'IBM Plex Mono',monospace;}
.ev-mini-add{
  font-size:12px;color:var(--green);background:none;border:1px dashed var(--green);
  padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;margin-top:8px;
}
.ev-summary{
  background:var(--gold-soft);border-radius:10px;padding:14px 16px;margin-top:16px;font-size:13px;
}
.ev-summary-row{display:flex;justify-content:space-between;padding:3px 0;}
.ev-summary-row .val{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.ev-summary-total{display:flex;justify-content:space-between;padding-top:8px;margin-top:6px;border-top:1px solid rgba(58,42,30,.15);font-weight:700;font-size:15px;}
.ev-summary-total .val{font-family:'IBM Plex Mono',monospace;color:var(--green);}
.ev-summary-split{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}

.ev-modal-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.ev-btn-primary{flex:1;min-width:120px;background:var(--green);color:#fff;border:none;padding:11px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;}
.ev-btn-close{flex:1;min-width:120px;background:var(--ink);color:var(--bg);border:none;padding:11px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;}
.ev-btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--ink-soft);padding:11px 16px;border-radius:9px;font-size:14px;cursor:pointer;font-family:inherit;}
.ev-btn-danger{background:var(--red-soft);color:var(--red);border:none;padding:11px 16px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:600;flex:1;}
.ev-hint{font-size:11.5px;color:var(--ink-soft);margin:-6px 0 12px;}
.ev-closed-banner{background:var(--green-soft);color:var(--green);font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:14px;border:1.5px solid var(--green);}
.ev-loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:13px;}
.ev-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;z-index:100;}


@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

:root{
  --bg:#FEF8E6;
  --surface:#FFFFFF;
  --ink:#21201C;
  --ink-soft:#4A4940;
  --green:#5E8C42;
  --green-light:#BCD38F;
  --green-soft:#E7EFD8;
  --red:#EE5533;
  --red-soft:#FDE1DA;
  --gold:#FFF3CC;
  --gold-soft:#FFF9E8;
  --coral:#EE5533;
  --coral-soft:#FEC0CD;
  --blue:#ACD3EF;
  --blue-soft:#E3F1FA;
  --border:#21201C;
  --fill-muted:#E3DED2;
  --radius:16px;
  --header-red:#ACD3EF;
}
*{box-sizing:border-box;}
body,.od-root{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;}
.od-root{padding:20px 16px 60px;max-width:820px;margin:0 auto;}

.od-header{margin-bottom:16px;}
.od-title{font-family:'Jao October','Archivo Black','IBM Plex Sans Thai',sans-serif;font-weight:700;font-size:26px;margin:0 0 2px;-webkit-text-stroke:0.6px var(--ink);}
.od-sub{font-size:13px;color:var(--ink-soft);}

.od-round-banner{
  background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:14px 16px;
  margin-bottom:18px;box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.od-round-info{flex:1;min-width:0;}
.od-round-name{font-weight:700;font-size:14.5px;}
.od-round-loc{font-size:12px;color:var(--ink-soft);}
.od-round-tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;background:var(--green-soft);color:var(--green);border:1.5px solid var(--ink);border-radius:5px;padding:2px 8px;}

.od-noround{
  background:var(--surface);border:2px dashed var(--ink);border-radius:var(--radius);
  padding:36px 24px;text-align:center;margin-bottom:20px;
}
.od-noround p{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px;}
.od-open-round-btn{
  background:var(--green);color:#fff;border:2px solid var(--ink);padding:13px 26px;border-radius:12px;
  font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:3px 3px 0 var(--ink);
}

.od-add{
  width:100%;background:var(--green);color:#fff;border:2px solid var(--ink);
  padding:16px;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:3px 3px 0 var(--ink);margin-bottom:20px;
}
.od-add:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink);}

.od-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.od-chip{font-size:12.5px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink-soft);cursor:pointer;font-family:inherit;font-weight:600;}
.od-chip.active{background:var(--ink);color:var(--bg);box-shadow:2px 2px 0 var(--ink);}

.od-list{display:flex;flex-direction:column;gap:10px;}
.od-row{
  background:var(--surface);border:2px solid var(--ink);border-radius:12px;
  padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:3px 3px 0 var(--ink);flex-wrap:wrap;
}
.od-row.ready{border-color:var(--green);}
.od-row.cancelled{opacity:.5;}
.od-qnum{
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:24px;
  background:var(--gold-soft);border:2px solid var(--ink);border-radius:10px;
  padding:4px 12px;flex:0 0 auto;min-width:54px;text-align:center;
}
.od-row.ready .od-qnum{background:var(--green-soft);}
.od-row.cancelled .od-qnum{background:var(--red-soft);}
.od-row-main{flex:1;min-width:120px;}
.od-row-items{font-size:13.5px;font-weight:600;}
.od-row-note{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.od-row-time{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
.od-row-total{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;flex:0 0 auto;}
.od-tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;padding:2px 8px;border-radius:5px;border:1.5px solid var(--ink);flex:0 0 auto;}
.od-tag.pending{background:var(--gold-soft);color:var(--ink);}
.od-tag.ready{background:var(--green-soft);color:var(--green);}
.od-tag.cancelled{background:var(--red-soft);color:var(--red);}
.od-tag.edited{background:#F3E4C8;color:#8B5E3C;}
.od-row-actions{display:flex;gap:6px;flex:0 0 auto;}
.od-serve-btn{
  flex:0 0 auto;background:var(--ink);color:var(--bg);border:none;border-radius:8px;
  padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
.od-icon-btn{background:none;border:1.5px solid var(--ink);border-radius:7px;cursor:pointer;padding:6px 9px;color:var(--ink-soft);font-family:inherit;font-size:12.5px;font-weight:700;}
.od-icon-btn:hover{background:var(--gold-soft);color:var(--ink);}
.od-empty{text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:13.5px;border:2px dashed var(--ink);border-radius:var(--radius);}

/* Modal */
.od-overlay{position:fixed;inset:0;background:rgba(23,19,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
@media (min-width:640px){.od-overlay{align-items:center;}}
.od-modal{background:var(--bg);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:22px 20px 26px;max-height:90vh;overflow-y:auto;border:2px solid var(--ink);border-bottom:none;}
@media (min-width:640px){.od-modal{border-radius:18px;border-bottom:2px solid var(--ink);}}
.od-modal h2{font-family:'Jao October','Archivo Black','IBM Plex Sans Thai',sans-serif;font-weight:700;font-size:20px;margin:0 0 16px;}
.od-field{margin-bottom:13px;}
.od-field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
.od-field input,.od-field textarea{width:100%;padding:9px 12px;border:1.5px solid var(--ink);border-radius:8px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink);}
.od-field input:focus,.od-field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
.od-item-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:4px;}
.od-item-del:hover{color:var(--red);}
.od-menu-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.od-menu-btn{
  width:100%;text-align:left;background:var(--surface);border:2px solid var(--ink);border-radius:10px;
  padding:13px 16px;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;
  box-shadow:2px 2px 0 var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.od-menu-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
.od-menu-btn .price{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-weight:600;font-size:13px;flex:0 0 56px;text-align:right;}
.od-menu-btn .plus{color:var(--green);font-size:18px;flex:0 0 18px;text-align:center;}
.od-cart{margin-bottom:14px;}
.od-cart-empty{font-size:12.5px;color:var(--ink-soft);padding:10px 0;text-align:center;}
.od-cart-line{
  display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--gold-soft);
  border:1.5px solid var(--ink);border-radius:8px;margin-bottom:6px;font-size:13.5px;font-weight:600;flex-wrap:wrap;
}
.od-cart-name{flex:1;min-width:100px;}
.od-cart-price{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);flex:0 0 auto;}
.od-cart-qty-ctrl{display:flex;align-items:center;gap:8px;}
.od-cart-qty-btn{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);
  cursor:pointer;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;
  font-family:inherit;line-height:1;padding:0;
}
.od-cart-qty-num{font-family:'IBM Plex Mono',monospace;min-width:18px;text-align:center;}
.od-cart-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:2px;}
.od-cart-del:hover{color:var(--red);}
.od-cart-total{
  display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
  background:var(--ink);color:var(--bg);border-radius:8px;font-weight:700;font-size:15px;margin-bottom:14px;
}
.od-cart-total .val{font-family:'IBM Plex Mono',monospace;font-size:19px;}
.od-custom-add{display:flex;gap:8px;margin-bottom:14px;}
.od-custom-add input{flex:1;}
.od-custom-add button{
  background:var(--ink);color:var(--bg);border:none;border-radius:8px;padding:0 14px;
  font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;
}
.od-modal-actions{display:flex;gap:10px;margin-top:16px;}
.od-btn-primary{flex:1;background:var(--green);color:#fff;border:2px solid var(--ink);padding:11px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:2px 2px 0 var(--ink);}
.od-btn-secondary{background:var(--surface);border:1.5px solid var(--ink);color:var(--ink-soft);padding:11px 16px;border-radius:9px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;}
.od-btn-danger{background:var(--red-soft);color:var(--red);border:2px solid var(--ink);padding:11px 16px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:700;}
.od-history-item{font-size:12px;color:var(--ink-soft);padding:6px 0;border-top:1px dashed var(--border);}
.od-history-item:first-child{border-top:none;}

/* Big queue confirmation */
.od-confirm-modal{background:var(--gold);border:3px solid var(--ink);border-radius:20px;padding:36px 30px;text-align:center;box-shadow:6px 6px 0 var(--ink);max-width:320px;}
.od-confirm-label{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;}
.od-confirm-num{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:72px;color:var(--ink);line-height:1;}
.od-confirm-ok{margin-top:20px;background:var(--ink);color:var(--bg);border:none;padding:12px 30px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}

.od-loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:13px;}
.od-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;z-index:100;}

:root{
  --bg:#FEF8E6;
  --surface:#FFFFFF;
  --ink:#21201C;
  --ink-soft:#4A4940;
  --green:#5E8C42;
  --green-light:#BCD38F;
  --green-soft:#E7EFD8;
  --red:#EE5533;
  --red-soft:#FDE1DA;
  --gold:#FFF3CC;
  --gold-soft:#FFF9E8;
  --coral:#EE5533;
  --coral-soft:#FEC0CD;
  --blue:#ACD3EF;
  --blue-soft:#E3F1FA;
  --border:#21201C;
  --fill-muted:#E3DED2;
  --radius:16px;
  --header-red:#ACD3EF;
}
*{box-sizing:border-box;}
body,.kt-root{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;}
.kt-root{padding:20px 16px 60px;max-width:960px;margin:0 auto;}

.kt-header{margin-bottom:18px;}
.kt-title{font-family:'Jao October','Archivo Black','IBM Plex Sans Thai',sans-serif;font-weight:700;font-size:26px;margin:0 0 2px;-webkit-text-stroke:0.6px var(--ink);}
.kt-sub{font-size:13px;color:var(--ink-soft);}
.kt-count-badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 12px;
  background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:999px;
  font-size:12.5px;font-weight:700;
}

/* ===== Receipt-rail concept ===== */
.kt-rail-wrap{margin-bottom:36px;position:relative;}
.kt-rail-label{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:18px;}
.kt-rail-bar{
  height:10px;background:var(--ink);border-radius:6px;
  box-shadow:0 2px 0 rgba(0,0,0,.15);
  margin-bottom:0;position:relative;z-index:1;
}
.kt-rail-track{
  display:flex;gap:22px;overflow-x:auto;padding:0 6px 16px;margin-top:-2px;
  scroll-snap-type:x proximity;
}
.kt-ticket{
  flex:0 0 auto;width:190px;background:var(--surface);border:2px solid var(--ink);
  border-radius:12px;padding:16px 14px 14px;position:relative;margin-top:16px;
  box-shadow:4px 4px 0 var(--ink);scroll-snap-align:start;
}
.kt-ticket::before{
  content:'';position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;background:var(--bg);border:2.5px solid var(--ink);
  z-index:2;
}
.kt-ticket:nth-child(odd){transform:rotate(-2deg);}
.kt-ticket:nth-child(even){transform:rotate(2deg);}
.kt-ticket-qnum{
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:26px;
  text-align:center;margin-bottom:8px;
}
.kt-ticket-items{font-size:13px;font-weight:600;border-top:1.5px dashed var(--border);padding-top:8px;margin-bottom:6px;min-height:36px;}
.kt-ticket-item-line{display:flex;justify-content:space-between;gap:6px;padding:1px 0;}
.kt-ticket-note{font-size:11px;color:var(--ink-soft);margin-bottom:10px;font-style:italic;}
.kt-ticket-time{font-size:10.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;text-align:center;margin-bottom:8px;}
.kt-ready-btn{
  width:100%;background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:8px;
  padding:9px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;
}
.kt-ready-btn:hover{transform:translate(1px,1px);}

.kt-ready-section{display:flex;flex-direction:column;gap:8px;}
.kt-ready-row{
  display:flex;align-items:center;gap:12px;background:var(--green-soft);border:1.5px solid var(--green);
  border-radius:10px;padding:9px 14px;font-size:13px;
}
.kt-ready-qnum{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;flex:0 0 auto;}
.kt-ready-items{flex:1;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kt-ready-tag{font-size:10.5px;font-weight:700;color:var(--green);flex:0 0 auto;}

.kt-empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13.5px;border:2px dashed var(--ink);border-radius:var(--radius);}
.kt-loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:13px;}
.kt-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;z-index:100;}


@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
:root{
  --bg:#FEF8E6;
  --surface:#FFFFFF;
  --ink:#21201C;
  --ink-soft:#4A4940;
  --green:#5E8C42;
  --green-light:#BCD38F;
  --green-soft:#E7EFD8;
  --red:#EE5533;
  --red-soft:#FDE1DA;
  --gold:#FFF3CC;
  --gold-soft:#FFF9E8;
  --coral:#EE5533;
  --coral-soft:#FEC0CD;
  --blue:#ACD3EF;
  --blue-soft:#E3F1FA;
  --border:#21201C;
  --fill-muted:#E3DED2;
  --radius:16px;
  --header-red:#ACD3EF;
}
*{box-sizing:border-box;}
body,.mn-root{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;}
.mn-root{padding:20px 16px 60px;max-width:820px;margin:0 auto;}
.mn-header{margin-bottom:16px;}
.mn-title{font-family:'Jao October','Archivo Black','IBM Plex Sans Thai',sans-serif;font-weight:700;font-size:26px;margin:0 0 2px;color:var(--ink);-webkit-text-stroke:0.6px var(--ink);}
.mn-sub{font-size:13px;color:var(--ink-soft);}
.mn-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.mn-add{margin-left:auto;background:var(--coral);color:#fff;border:none;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 8px rgba(0,0,0,.12);}
.mn-list{display:flex;flex-direction:column;gap:8px;}
.mn-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 16px;box-shadow:0 2px 6px rgba(0,0,0,.05);flex-wrap:wrap;}
.mn-row.dragging{opacity:.4;}
.mn-row.drag-over{border-color:var(--green,#3F7A52);box-shadow:0 0 0 2px var(--green,#3F7A52) inset;}
.mn-row.inactive{opacity:.5;}
.mn-name{flex:1;font-weight:700;font-size:14.5px;}
.mn-price{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;color:var(--coral);flex:0 0 auto;}
.mn-toggle{position:relative;width:42px;height:24px;flex:0 0 auto;}
.mn-toggle input{opacity:0;width:0;height:0;}
.mn-toggle-slider{position:absolute;inset:0;background:var(--fill-muted);border-radius:999px;cursor:pointer;transition:.2s;}
.mn-toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.mn-toggle input:checked + .mn-toggle-slider{background:var(--coral);}
.mn-toggle input:checked + .mn-toggle-slider::before{transform:translateX(18px);}
.mn-row-actions{display:flex;gap:2px;flex:0 0 auto;}
.mn-icon-btn{background:none;border:none;cursor:pointer;padding:5px;color:var(--ink-soft);border-radius:6px;}
.mn-icon-btn:hover{background:var(--blue-soft);color:var(--ink);}
.mn-empty{text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:13.5px;border:1.5px dashed var(--border);border-radius:var(--radius);}
.mn-overlay{position:fixed;inset:0;background:rgba(59,66,88,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
@media (min-width:640px){.mn-overlay{align-items:center;}}
.mn-modal{background:var(--bg);width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:22px 20px 26px;max-height:88vh;overflow-y:auto;}
@media (min-width:640px){.mn-modal{border-radius:18px;}}
.mn-modal h2{font-family:'Jao October','Archivo Black','IBM Plex Sans Thai',sans-serif;font-size:19px;margin:0 0 16px;color:var(--coral);}
.mn-field{margin-bottom:13px;}
.mn-field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
.mn-field input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink);}
.mn-field input:focus{outline:2px solid var(--coral);outline-offset:1px;}
.mn-modal-actions{display:flex;gap:10px;margin-top:18px;}
.mn-btn-primary{flex:1;background:var(--coral);color:#fff;border:none;padding:11px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
.mn-btn-secondary{background:var(--surface);border:1.5px solid var(--border);color:var(--ink-soft);padding:11px 16px;border-radius:9px;font-size:14px;cursor:pointer;font-family:inherit;}
.mn-btn-danger{background:var(--coral-soft);color:var(--coral);border:none;padding:11px 16px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:700;flex:1;}
.mn-loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:13px;}
.mn-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:100;}


@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
:root{
  --bg:#FEF8E6;
  --surface:#FFFFFF;
  --ink:#21201C;
  --ink-soft:#4A4940;
  --green:#5E8C42;
  --green-light:#BCD38F;
  --green-soft:#E7EFD8;
  --red:#EE5533;
  --red-soft:#FDE1DA;
  --gold:#FFF3CC;
  --gold-soft:#FFF9E8;
  --coral:#EE5533;
  --coral-soft:#FEC0CD;
  --blue:#ACD3EF;
  --blue-soft:#E3F1FA;
  --border:#21201C;
  --fill-muted:#E3DED2;
  --radius:16px;
  --header-red:#ACD3EF;
}
*{box-sizing:border-box;}
body,.ig-root{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;}
.ig-root{padding:20px 16px 60px;max-width:820px;margin:0 auto;}
.ig-header{margin-bottom:16px;}
.ig-title{font-family:'Jao October','Archivo Black','IBM Plex Sans Thai',sans-serif;font-weight:700;font-size:26px;margin:0 0 2px;color:var(--ink);-webkit-text-stroke:0.6px var(--ink);}
.ig-sub{font-size:13px;color:var(--ink-soft);}
.ig-toolbar{display:flex;gap:8px;margin-bottom:14px;}
.ig-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:999px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink);}
.ig-input:focus{outline:2px solid var(--coral);outline-offset:1px;}
.ig-add{background:var(--coral);color:#fff;border:none;padding:10px 20px;border-radius:999px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13.5px;}
.ig-list{display:flex;flex-wrap:wrap;gap:8px;}
.ig-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:8px 8px 8px 16px;font-size:13.5px;font-weight:600;}
.ig-chip button{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:4px;border-radius:50%;}
.ig-chip button:hover{background:var(--coral-soft);color:var(--coral);}
.ig-empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13.5px;border:1.5px dashed var(--border);border-radius:var(--radius);width:100%;}
.ig-section-title{font-family:'Taviraj',serif;font-size:16px;font-weight:600;margin:24px 0 10px;color:var(--ink);}
.ig-rowlist{display:flex;flex-direction:column;gap:8px;}
.ig-item-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13.5px;flex-wrap:wrap;}
.ig-item-row.inactive{opacity:.5;}
.ig-item-row.dragging{opacity:.4;}
.ig-item-row.drag-over{border-color:var(--green,#3F7A52);box-shadow:0 0 0 2px var(--green,#3F7A52) inset;}
.ig-item-name{flex:1;font-weight:600;}
.ig-item-amount{color:var(--ink-soft);font-weight:600;}
.ig-item-row button{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:4px;border-radius:50%;}
.ig-item-row button:hover{background:var(--coral-soft);color:var(--coral);}
.ig-toggle{position:relative;width:38px;height:22px;flex:0 0 auto;}
.ig-toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.ig-toggle-slider{position:absolute;inset:0;background:var(--fill-muted);border-radius:999px;cursor:pointer;transition:.2s;}
.ig-toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.ig-toggle input:checked + .ig-toggle-slider{background:var(--coral);}
.ig-toggle input:checked + .ig-toggle-slider::before{transform:translateX(16px);}
.ig-loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:13px;}
.ig-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:100;}

<script>
(function(){
  var SUPABASE_URL = 'https://hobwibvcpitlisnbovem.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvYndpYnZjcGl0bGlzbmJvdmVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2ODI5ODAsImV4cCI6MjEwMDI1ODk4MH0.ZTTVHT_mOsodUwl9b5TjoXgfj5FpNP-Cge6YbknPFqo';
  var LOGIN_EMAIL = 'chutima.tester@gmail.com';

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window.supabaseClient = supabase;

  var resolveAuthReady;
  window.authReady = new Promise(function(resolve){ resolveAuthReady = resolve; });

  function hideGate(){
    var el = document.getElementById('pin-gate');
    if(el) el.style.display = 'none';
  }

  async function tryLogin(pin){
    var errEl = document.getElementById('pin-error');
    var btn = document.getElementById('pin-submit');
    if(errEl) errEl.style.display = 'none';
    if(btn){ btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...'; }
    var result = await supabase.auth.signInWithPassword({ email: LOGIN_EMAIL, password: pin });
    if(btn){ btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; }
    if(result.error){
      if(errEl) errEl.style.display = 'block';
      return;
    }
    hideGate();
    resolveAuthReady();
  }

  function initGateUI(){
    var btn = document.getElementById('pin-submit');
    var input = document.getElementById('pin-input');
    if(!btn || !input) return;
    btn.addEventListener('click', function(){ tryLogin(input.value.trim()); });
    input.addEventListener('keydown', function(ev){
      if(ev.key === 'Enter'){ ev.preventDefault(); tryLogin(input.value.trim()); }
    });
    input.focus();
  }

  (async function(){
    initGateUI();
    var sessionResult = await supabase.auth.getSession();
    if(sessionResult.data && sessionResult.data.session){
      hideGate();
      resolveAuthReady();
    }
  })();

  // =====================================================================
  // Generic helpers ให้แต่ละโมดูลใช้แทน window.storage เดิม
  // =====================================================================
  window.dbLoadTable = async function(table){
    await window.authReady;
    const { data, error } = await supabase.from(table).select('*');
    return error ? [] : (data || []);
  };

  window.dbSyncTable = async function(table, idField, rows){
    await window.authReady;
    const { data: existing } = await supabase.from(table).select(idField);
    const existingIds = (existing || []).map(r => r[idField]);
    const currentIds = rows.map(r => r[idField]);
    const toDelete = existingIds.filter(id => !currentIds.includes(id));
    if(toDelete.length){
      const { error: delErr } = await supabase.from(table).delete().in(idField, toDelete);
      if(delErr) return false;
    }
    if(rows.length){
      const { error: upErr } = await supabase.from(table).upsert(rows);
      if(upErr) return false;
    }
    return true;
  };

  window.dbSyncEventChildren = async function(eventIds, ingRows, costRows, usageRows){
    await window.authReady;
    if(eventIds.length){
      await supabase.from('event_ingredients').delete().in('event_id', eventIds);
      await supabase.from('event_other_costs').delete().in('event_id', eventIds);
      await supabase.from('event_supply_usage').delete().in('event_id', eventIds);
    }
    if(ingRows.length) await supabase.from('event_ingredients').insert(ingRows);
    if(costRows.length) await supabase.from('event_other_costs').insert(costRows);
    if(usageRows.length) await supabase.from('event_supply_usage').insert(usageRows);
  };

  window.dbLoadEventChildren = async function(){
    await window.authReady;
    const [ing, cost, usage] = await Promise.all([
      supabase.from('event_ingredients').select('*'),
      supabase.from('event_other_costs').select('*'),
      supabase.from('event_supply_usage').select('*'),
    ]);
    return { ing: ing.data || [], cost: cost.data || [], usage: usage.data || [] };
  };

  // ตารางลูกของ orders (order_items / order_edit_history)
  window.dbSyncOrderChildren = async function(orderIds, itemRows, historyRows){
    await window.authReady;
    if(orderIds.length){
      await supabase.from('order_items').delete().in('order_id', orderIds);
      await supabase.from('order_edit_history').delete().in('order_id', orderIds);
    }
    if(itemRows.length) await supabase.from('order_items').insert(itemRows);
    if(historyRows.length) await supabase.from('order_edit_history').insert(historyRows);
  };

  window.dbLoadOrderChildren = async function(){
    await window.authReady;
    const [items, history] = await Promise.all([
      supabase.from('order_items').select('*'),
      supabase.from('order_edit_history').select('*').order('at', {ascending:true}),
    ]);
    return { items: items.data || [], history: history.data || [] };
  };
})();

</script>
<script>

(function(){
  const STORE_KEY = 'fixed_assets_list';
  const CATS = ['โต๊ะ','หม้อ/ภาชนะ','ชั้นวาง','อุปกรณ์ครัว','อุปกรณ์ไฟฟ้า','อื่นๆ'];
  const STATUSES = ['ใช้งานอยู่','ไม่ใช้งาน'];
  const OWNER_OPTIONS = ['Chu','Fah','อื่นๆ (ระบุเอง)'];

  let assets = [];
  let filterStatus = 'all';
  let searchQ = '';
  let editingId = null;
  let viewMode = 'card';

  const root = document.getElementById('faw-root');

  function fmtMoney(n){
    return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2});
  }
  function fmtDate(d){
    if(!d) return '-';
    try{
      const dt = new Date(d);
      return dt.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'});
    }catch(e){return d;}
  }
  function uid(){return 'a'+Date.now()+Math.random().toString(36).slice(2,7);}
  function withLoading(btn, loadingText, fn){
    if(btn.disabled) return; // already in progress, ignore extra clicks
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.style.opacity = '.6';
    btn.style.cursor = 'wait';
    btn.textContent = loadingText;
    Promise.resolve(fn()).catch(()=>{}).finally(()=>{
      if(document.body.contains(btn)){
        btn.disabled = false;
        btn.style.opacity = '';
        btn.style.cursor = '';
        btn.innerHTML = original;
      }
    });
  }
  function nextFaId(){
    let max = 0;
    assets.forEach(a=>{
      const m = /^FA-(\d+)$/.exec(a.faId||'');
      if(m) max = Math.max(max, parseInt(m[1],10));
    });
    return 'FA-' + String(max+1).padStart(4,'0');
  }

  function iconPencil(){
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
  }
  function iconTrash(){
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
  }
  function iconPlus(){
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  }
  function iconList(){
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>';
  }
  function iconGrid(){
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';
  }

  async function loadAll(){
    try{
      const rows = await window.dbLoadTable('assets');
      assets = rows.map(r=>({
        id: r.id, faId: r.fa_id, name: r.name, owner: r.owner, category: r.category,
        status: r.status, purchaseDate: r.purchase_date, price: r.price, note: r.note,
        paidBack: r.paid_back
      }));
    }catch(e){
      assets = [];
    }
    viewMode = localStorage.getItem('congee_view_mode') || 'card';
    render();
  }

  async function saveAssets(){
    try{
      const rows = assets.map(a=>({
        id: a.id, fa_id: a.faId, name: a.name, owner: a.owner, category: a.category,
        status: a.status, purchase_date: a.purchaseDate || null, price: Number(a.price)||0,
        note: a.note || '', paid_back: !!a.paidBack
      }));
      const ok = await window.dbSyncTable('assets', 'id', rows);
      if(!ok) toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
    }catch(e){
      toast('เกิดข้อผิดพลาดในการบันทึก');
    }
  }

  function toast(msg){
    const t = document.createElement('div');
    t.className='faw-toast';
    t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),2200);
  }

  function summary(){
    const active = assets.filter(a=>a.status==='ใช้งานอยู่');
    const disposed = assets.filter(a=>a.status==='ไม่ใช้งาน');
    const totalValue = active.reduce((s,a)=>s+Number(a.price||0),0);
    return {count:assets.length, activeCount:active.length, disposedCount:disposed.length, totalValue};
  }

  function filteredAssets(){
    return assets.filter(a=>{
      if(filterStatus!=='all' && a.status!==filterStatus) return false;
      if(searchQ && !(a.name||'').toLowerCase().includes(searchQ.toLowerCase())) return false;
      return true;
    }).sort((a,b)=> new Date(b.purchaseDate||0) - new Date(a.purchaseDate||0));
  }

  function render(){
    const s = summary();
    const list = filteredAssets();

    root.innerHTML = `
      <div class="faw-header">
        <h1 class="faw-title">Fixed Assets</h1>
        <div class="faw-sub">ของใช้ถาวร — ใช้ในการขายระยะยาว</div>
      </div>

      <div class="faw-receipt">
        <div class="faw-receipt-row"><span class="lbl">รายการทั้งหมด</span><span class="val">${s.count} ชิ้น</span></div>
        <div class="faw-receipt-total"><span class="lbl">มูลค่าทรัพย์สินที่ใช้งานอยู่</span><span class="val">฿${fmtMoney(s.totalValue)}</span></div>
      </div>

      <div class="faw-toolbar">
        <button class="faw-chip ${filterStatus==='all'?'active':''}" data-filter="all">ทั้งหมด</button>
        ${STATUSES.map(st=>`<button class="faw-chip ${filterStatus===st?'active':''}" data-filter="${st}">${st}</button>`).join('')}
        <input class="faw-search" id="faw-search" placeholder="ค้นหาชื่อทรัพย์สิน..." value="${searchQ}">
        <div class="faw-viewtoggle">
          <button class="faw-viewbtn ${viewMode==='card'?'active':''}" data-view="card" title="มุมมองการ์ด">${iconGrid()}</button>
          <button class="faw-viewbtn ${viewMode==='list'?'active':''}" data-view="list" title="มุมมองรายการ">${iconList()}</button>
        </div>
        <button class="faw-add" id="faw-add-btn">${iconPlus()} เพิ่มทรัพย์สิน</button>
      </div>

      <div class="faw-list ${viewMode==='card'?'view-card':'view-list'}" id="faw-list">
        ${list.length===0 ? `<div class="faw-empty">ยังไม่มีรายการในหมวดนี้ — กดปุ่ม "เพิ่มทรัพย์สิน" เพื่อเริ่มบันทึก</div>` : list.map(viewMode==='card'?cardHtml:listRowHtml).join('')}
      </div>
    `;

    document.getElementById('faw-add-btn').onclick = ()=>openModal(null);
    document.getElementById('faw-search').oninput = (e)=>{searchQ=e.target.value; render(); document.getElementById('faw-search').focus(); document.getElementById('faw-search').selectionStart = document.getElementById('faw-search').value.length;};
    root.querySelectorAll('[data-filter]').forEach(btn=>{
      btn.onclick = ()=>{filterStatus=btn.dataset.filter; render();};
    });
    root.querySelectorAll('[data-view]').forEach(btn=>{
      btn.onclick = async ()=>{
        viewMode = btn.dataset.view;
        render();
        try{ localStorage.setItem('congee_view_mode', viewMode); }catch(e){}
      };
    });
    root.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.onclick = ()=>openModal(btn.dataset.edit);
    });
    root.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = ()=>deleteAsset(btn.dataset.del);
    });
    root.querySelectorAll('[data-paidback]').forEach(btn=>{
      btn.onclick = async ()=>{
        const a = assets.find(x=>x.id===btn.dataset.paidback);
        if(a){ a.paidBack = !a.paidBack; await saveAssets(); render(); toast(a.paidBack?'ทำเครื่องหมายคืนทุนแล้ว':'ยกเลิกสถานะคืนทุน'); }
      };
    });
  }

  function listRowHtml(a){
    return `
      <div class="faw-row status-${a.status}">
        <span class="faw-faid faw-row-faid">${escapeHtml(a.faId||'-')}</span>
        <span class="faw-row-name" title="${escapeHtml(a.name)}">${escapeHtml(a.name)}</span>
        <span class="faw-row-cat">${escapeHtml(a.category||'-')}</span>
        <span class="faw-tag st-${a.status} faw-row-status">${a.status}</span>
        <span class="faw-row-owner">${escapeHtml(a.owner||'-')}</span>
        <span class="faw-row-date">${fmtDate(a.purchaseDate)}</span>
        <span class="faw-row-price">฿${fmtMoney(a.price)}</span>
        <span class="faw-row-actions">
          <button class="faw-icon-btn" data-paidback="${a.id}" title="${a.paidBack?'ยกเลิกคืนทุน':'ทำเครื่องหมายคืนทุนแล้ว'}">${a.paidBack?'💰':'⭕'}</button>
          <button class="faw-icon-btn" data-edit="${a.id}" title="แก้ไข">${iconPencil()}</button>
          <button class="faw-icon-btn" data-del="${a.id}" title="ลบ">${iconTrash()}</button>
        </span>
      </div>
    `;
  }

  function cardHtml(a){
    return `
      <div class="faw-ticket status-${a.status}">
        <div class="faw-ticket-main">
          <div class="faw-ticket-name"><span class="faw-faid">${escapeHtml(a.faId||'-')}</span> ${escapeHtml(a.name)}</div>
          <div class="faw-ticket-meta">
            <span class="faw-tag st-${a.status}">${a.status}</span>
            ${a.paidBack?'<span class="faw-tag st-ใช้งานอยู่" style="background:var(--green-soft);color:var(--green);">คืนทุนแล้ว</span>':''}
            <span>${a.category||'-'}</span>
            <span>ซื้อเมื่อ ${fmtDate(a.purchaseDate)}</span>
            ${a.owner?`<span>เจ้าของ: ${escapeHtml(a.owner)}</span>`:''}
          </div>
          ${a.note?`<div class="faw-ticket-note">${escapeHtml(a.note)}</div>`:''}
        </div>
        <div class="faw-ticket-right">
          <div class="faw-ticket-price">฿${fmtMoney(a.price)}</div>
          <div class="faw-ticket-actions">
            <button class="faw-icon-btn" data-paidback="${a.id}" title="${a.paidBack?'ยกเลิกคืนทุน':'ทำเครื่องหมายคืนทุนแล้ว'}">${a.paidBack?'💰':'⭕'}</button>
            <button class="faw-icon-btn" data-edit="${a.id}" title="แก้ไข">${iconPencil()}</button>
            <button class="faw-icon-btn" data-del="${a.id}" title="ลบ">${iconTrash()}</button>
          </div>
        </div>
      </div>
    `;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str||'';
    return d.innerHTML;
  }

  function openModal(id){
    editingId = id;
    const a = id ? assets.find(x=>x.id===id) : null;
    const overlay = document.createElement('div');
    overlay.className='faw-overlay';
    overlay.innerHTML = `
      <div class="faw-modal">
        <h2>${a?'แก้ไขทรัพย์สิน':'เพิ่มทรัพย์สินใหม่'}</h2>
        ${a?`<div class="faw-field"><label>FA ID</label><input value="${escapeHtml(a.faId||'-')}" disabled></div>`:''}
        <div class="faw-field">
          <label>ชื่อทรัพย์สิน</label>
          <input id="f-name" value="${a?escapeHtml(a.name):''}" placeholder="เช่น โต๊ะพับสแตนเลส">
        </div>
        <div class="faw-field">
          <label>เจ้าของ / ผู้รับผิดชอบ</label>
          <select id="f-owner-select">
            ${OWNER_OPTIONS.map(o=>{
              const isOther = o===OWNER_OPTIONS[OWNER_OPTIONS.length-1];
              const isCustom = a && a.owner && !OWNER_OPTIONS.slice(0,-1).includes(a.owner);
              const selected = a ? (isCustom ? isOther : a.owner===o) : false;
              return `<option value="${escapeHtml(o)}" ${selected?'selected':''}>${escapeHtml(o)}</option>`;
            }).join('')}
          </select>
        </div>
        <div class="faw-field" id="f-owner-custom-wrap" style="${(a && a.owner && !OWNER_OPTIONS.slice(0,-1).includes(a.owner))?'':'display:none;'}">
          <label>ระบุชื่อเจ้าของเอง</label>
          <input id="f-owner-custom" value="${(a && a.owner && !OWNER_OPTIONS.slice(0,-1).includes(a.owner))?escapeHtml(a.owner):''}" placeholder="พิมพ์ชื่อ">
        </div>
        <div class="faw-row2">
          <div class="faw-field">
            <label>หมวดหมู่</label>
            <select id="f-category">
              ${CATS.map(c=>`<option ${a&&a.category===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
          <div class="faw-field">
            <label>สถานะ</label>
            <select id="f-status">
              ${STATUSES.map(st=>`<option ${a&&a.status===st?'selected':(!a&&st==='ใช้งานอยู่'?'selected':'')}>${st}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="faw-row2">
          <div class="faw-field">
            <label>วันที่ซื้อ</label>
            <input id="f-date" type="date" value="${a?a.purchaseDate:new Date().toISOString().slice(0,10)}">
          </div>
          <div class="faw-field">
            <label>ราคาซื้อ (บาท)</label>
            <input id="f-price" type="number" step="0.01" min="0" value="${a?a.price:''}" placeholder="0.00">
          </div>
        </div>
        <div class="faw-field">
          <label>หมายเหตุ</label>
          <textarea id="f-note" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)">${a?escapeHtml(a.note||''):''}</textarea>
        </div>
        <div class="faw-modal-actions">
          <button class="faw-btn-secondary" id="f-cancel">ยกเลิก</button>
          <button class="faw-btn-primary" id="f-save">${a?'บันทึกการแก้ไข':'เพิ่มรายการ'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#f-cancel').onclick = ()=>overlay.remove();
    const ownerSelect = overlay.querySelector('#f-owner-select');
    ownerSelect.onchange = ()=>{
      const wrap = overlay.querySelector('#f-owner-custom-wrap');
      wrap.style.display = ownerSelect.value===OWNER_OPTIONS[OWNER_OPTIONS.length-1] ? '' : 'none';
    };
    overlay.querySelector('#f-save').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังบันทึก...', async ()=>{
        const name = overlay.querySelector('#f-name').value.trim();
        if(!name){ toast('กรุณาระบุชื่อทรัพย์สิน'); throw new Error('validation'); }
        let owner = overlay.querySelector('#f-owner-select').value;
        if(owner===OWNER_OPTIONS[OWNER_OPTIONS.length-1]){
          owner = overlay.querySelector('#f-owner-custom').value.trim();
        }
        const payload = {
          id: a?a.id:uid(),
          faId: a?a.faId:nextFaId(),
          name,
          owner,
          category: overlay.querySelector('#f-category').value,
          status: overlay.querySelector('#f-status').value,
          purchaseDate: overlay.querySelector('#f-date').value,
          price: parseFloat(overlay.querySelector('#f-price').value)||0,
          note: overlay.querySelector('#f-note').value.trim(),
          paidBack: a?!!a.paidBack:false,
        };
        if(a){
          const idx = assets.findIndex(x=>x.id===a.id);
          assets[idx] = payload;
        }else{
          assets.push(payload);
        }
        await saveAssets();
        overlay.remove();
        render();
        toast(a?'แก้ไขรายการแล้ว':'เพิ่มรายการแล้ว');
      });
    };
    overlay.querySelector('#f-name').focus();
  }

  function deleteAsset(id){
    const a = assets.find(x=>x.id===id);
    if(!a) return;
    const overlay = document.createElement('div');
    overlay.className='faw-overlay';
    overlay.innerHTML = `
      <div class="faw-modal" style="max-width:380px;">
        <h2>ยืนยันการลบ</h2>
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 20px;">
          ต้องการลบ <b style="color:var(--ink);">${escapeHtml(a.faId||'')} ${escapeHtml(a.name)}</b> ออกจากทะเบียนทรัพย์สินใช่หรือไม่? การลบไม่สามารถย้อนกลับได้
        </p>
        <div class="faw-modal-actions">
          <button class="faw-btn-secondary" id="del-cancel">ยกเลิก</button>
          <button class="faw-btn-danger" id="del-confirm" style="flex:1;">ลบรายการ</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#del-cancel').onclick = ()=>overlay.remove();
    overlay.querySelector('#del-confirm').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังลบ...', async ()=>{
        assets = assets.filter(x=>x.id!==id);
        await saveAssets();
        overlay.remove();
        render();
        toast('ลบรายการแล้ว');
      });
    };
  }

  loadAll();
})();

</script>
<script>

(function(){
  const MASTER_KEY = 'supplies_master_list';
  const TX_KEY = 'supplies_transactions_list';
  const UNITS = ['ชิ้น','ซอง','ถุง','กรัม','กิโลกรัม','มิลลิลิตร','ลิตร','คู่','ม้วน','กล่อง','ขวด','อื่นๆ'];
  const CATEGORY_OPTIONS = ['ส่วนประกอบอาหาร','บรรจุภัณฑ์ (Packaging)','เครื่องปรุง/ซอง','อุปกรณ์ทานอาหาร (ช้อน/ตะเกียบ)','ถุงมือ/เซฟตี้','ความสะอาด/สุขอนามัย','อื่นๆ (ระบุเอง)'];
  const USAGE_TYPES = [
    {value:'per_bowl', label:'ผันแปรตามชาม', hint:'ใช้ตามจำนวนโจ๊กที่ขายได้ เช่น ซองเครื่องปรุง ช้อน'},
    {value:'general', label:'ทั่วไป', hint:'ไม่ขึ้นกับจำนวนชาม เช่น ถุงมือ ถุงขยะ ทิชชู่'},
  ];

  let master = [];
  let transactions = [];
  let activeTab = 'master'; // master | stock | tx
  let masterSearch = '';
  let dragMasterId = null;
  let masterUsageFilter = 'all';
  let txFilterItem = 'all';
  let txFilterType = 'all';
  let lowStockOnly = false;

  const root = document.getElementById('sw-root');

  function fmtMoney(n){ return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function fmtNum(n){ return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function fmtDate(d){
    if(!d) return '-';
    try{ return new Date(d).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}); }
    catch(e){ return d; }
  }
  function uid(p){ return (p||'x')+Date.now()+Math.random().toString(36).slice(2,7); }
  function withLoading(btn, loadingText, fn){
    if(btn.disabled) return;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.style.opacity = '.6';
    btn.style.cursor = 'wait';
    btn.textContent = loadingText;
    Promise.resolve(fn()).catch(()=>{}).finally(()=>{
      if(document.body.contains(btn)){
        btn.disabled = false;
        btn.style.opacity = '';
        btn.style.cursor = '';
        btn.innerHTML = original;
      }
    });
  }
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }

  function iconPencil(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>'; }
  function iconTrash(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>'; }
  function iconPlus(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'; }
  function iconDrag(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>'; }

  async function loadAll(){
    try{
      const rows = await window.dbLoadTable('supplies_master');
      master = rows.map(r=>({
        id: r.id, name: r.name, unit: r.unit, category: r.category,
        usageType: r.usage_type, qtyPerBowl: r.qty_per_bowl, minStock: r.min_stock, sortOrder: r.sort_order||0
      }));
      master.sort((a,b)=>a.sortOrder-b.sortOrder);
    }catch(e){ master = []; }
    try{
      const rows = await window.dbLoadTable('supplies_transactions');
      transactions = rows.map(r=>({
        id: r.id, type: r.type, itemId: r.item_id, date: r.date,
        quantity: r.quantity, unitCost: r.unit_cost, note: r.note, eventId: r.event_id
      }));
    }catch(e){ transactions = []; }
    render();
  }
  async function saveMaster(){
    try{
      const rows = master.map((m,idx)=>({
        id: m.id, name: m.name, unit: m.unit, category: m.category,
        usage_type: m.usageType, qty_per_bowl: Number(m.qtyPerBowl)||0, min_stock: Number(m.minStock)||0, sort_order: idx
      }));
      const ok = await window.dbSyncTable('supplies_master', 'id', rows);
      if(!ok) toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
    }catch(e){ toast('เกิดข้อผิดพลาดในการบันทึก'); }
  }
  async function saveTx(){
    try{
      const rows = transactions.map(t=>({
        id: t.id, type: t.type, item_id: t.itemId, date: t.date || null,
        quantity: Number(t.quantity)||0, unit_cost: Number(t.unitCost)||0,
        note: t.note || '', event_id: t.eventId || null
      }));
      const ok = await window.dbSyncTable('supplies_transactions', 'id', rows);
      if(!ok) toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
    }catch(e){ toast('เกิดข้อผิดพลาดในการบันทึก'); }
  }
  function toast(msg){
    const t = document.createElement('div');
    t.className='sw-toast'; t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),2200);
  }

  // ---- Costing engine: moving average ----
  function computeLedger(){
    const state = {}; // itemId -> {qty, value}
    const sorted = [...transactions].sort((a,b)=> new Date(a.date)-new Date(b.date) || String(a.id).localeCompare(String(b.id)));
    const ledger = [];
    sorted.forEach(tx=>{
      if(!state[tx.itemId]) state[tx.itemId] = {qty:0, value:0};
      const s = state[tx.itemId];
      let unitCostAtTime=0, totalCostAtTime=0;
      if(tx.type==='in'){
        unitCostAtTime = Number(tx.unitCost)||0;
        totalCostAtTime = Number(tx.quantity||0)*unitCostAtTime;
        s.qty += Number(tx.quantity)||0;
        s.value += totalCostAtTime;
      }else{
        unitCostAtTime = s.qty>0 ? s.value/s.qty : 0;
        const outQty = Number(tx.quantity)||0;
        totalCostAtTime = unitCostAtTime*outQty;
        s.qty -= outQty;
        s.value -= totalCostAtTime;
        if(s.qty<0.0001){ s.qty=0; }
        if(s.value<0){ s.value=0; }
      }
      ledger.push(Object.assign({}, tx, {computedUnitCost:unitCostAtTime, computedTotalCost:totalCostAtTime}));
    });
    return {state, ledger};
  }

  function currentStockFor(itemId, state){
    const s = state[itemId];
    if(!s || s.qty<=0) return {qty:0, avgCost:0, value:0};
    return {qty:s.qty, avgCost:s.value/s.qty, value:s.value};
  }

  function txCountFor(itemId){
    return transactions.filter(t=>t.itemId===itemId).length;
  }

  // ============ RENDER ============
  function render(){
    root.innerHTML = `
      <div class="sw-header">
        <h1 class="sw-title">Supplies</h1>
        <div class="sw-sub">ของใช้สิ้นเปลือง — เติมเข้า ตัดออก จาก stock และคำนวณต้นทุนอัตโนมัติ</div>
      </div>
      <div class="sw-tabs">
        <button class="sw-tab ${activeTab==='master'?'active':''}" data-tab="master">รายการวัตถุดิบ</button>
        <button class="sw-tab ${activeTab==='stock'?'active':''}" data-tab="stock">สต๊อกปัจจุบัน</button>
        <button class="sw-tab ${activeTab==='tx'?'active':''}" data-tab="tx">ประวัติเข้า-ออก</button>
      </div>
      <div id="sw-content"></div>
    `;
    root.querySelectorAll('[data-tab]').forEach(b=>{
      b.onclick = ()=>{ activeTab=b.dataset.tab; render(); };
    });
    const content = document.getElementById('sw-content');
    if(activeTab==='master') renderMaster(content);
    else if(activeTab==='stock') renderStock(content);
    else renderTx(content);
  }

  // ---- MASTER TAB ----
  function renderMaster(content){
    const isUnfiltered = !masterSearch && masterUsageFilter==='all';
    const list = master.filter(m=> !masterSearch || m.name.toLowerCase().includes(masterSearch.toLowerCase()))
                        .filter(m=> masterUsageFilter==='all' || m.usageType===masterUsageFilter);
    if(!isUnfiltered) list.sort((a,b)=> a.name.localeCompare(b.name,'th'));
    content.innerHTML = `
      <div class="sw-toolbar">
        <input class="sw-search" id="sw-m-search" placeholder="ค้นหารายการ..." value="${masterSearch}">
        <button class="sw-chip ${masterUsageFilter==='all'?'active':''}" data-muf="all">ทั้งหมด</button>
        <button class="sw-chip ${masterUsageFilter==='per_bowl'?'active':''}" data-muf="per_bowl">ผันแปรตามชาม</button>
        <button class="sw-chip ${masterUsageFilter==='general'?'active':''}" data-muf="general">ทั่วไป</button>
        <button class="sw-add" id="sw-m-add">${iconPlus()} เพิ่มรายการ</button>
      </div>
      ${isUnfiltered?'<div class="sw-hint">ลากที่ไอคอน ⠿ เพื่อจัดลำดับใหม่</div>':''}
      <div class="sw-list" id="sw-master-list">
        ${list.length===0?`<div class="sw-empty">ยังไม่มีรายการวัตถุดิบ — กด "เพิ่มรายการ" เพื่อเริ่มบันทึก</div>`:list.map(m=>masterRow(m,isUnfiltered)).join('')}
      </div>
    `;
    document.getElementById('sw-m-search').oninput = (e)=>{
      masterSearch = e.target.value; renderMaster(content);
      const el = document.getElementById('sw-m-search'); el.focus(); el.selectionStart = el.value.length;
    };
    content.querySelectorAll('[data-muf]').forEach(b=> b.onclick = ()=>{ masterUsageFilter=b.dataset.muf; renderMaster(content); });
    document.getElementById('sw-m-add').onclick = ()=>openMasterModal(null);
    content.querySelectorAll('[data-medit]').forEach(b=> b.onclick = ()=>openMasterModal(b.dataset.medit));
    content.querySelectorAll('[data-mdel]').forEach(b=> b.onclick = ()=>confirmDeleteMaster(b.dataset.mdel));
    if(isUnfiltered){
      content.querySelectorAll('#sw-master-list .sw-row').forEach(rowEl=>{
        rowEl.addEventListener('dragstart', ()=>{ dragMasterId = rowEl.dataset.id; rowEl.classList.add('dragging'); });
        rowEl.addEventListener('dragend', ()=>{ dragMasterId = null; rowEl.classList.remove('dragging'); content.querySelectorAll('#sw-master-list .sw-row').forEach(r=>r.classList.remove('drag-over')); });
        rowEl.addEventListener('dragover', (e)=>{ e.preventDefault(); if(rowEl.dataset.id!==dragMasterId) rowEl.classList.add('drag-over'); });
        rowEl.addEventListener('dragleave', ()=>{ rowEl.classList.remove('drag-over'); });
        rowEl.addEventListener('drop', async (e)=>{
          e.preventDefault();
          rowEl.classList.remove('drag-over');
          const targetId = rowEl.dataset.id;
          if(!dragMasterId || dragMasterId===targetId) return;
          const fromIdx = master.findIndex(x=>x.id===dragMasterId);
          const toIdx = master.findIndex(x=>x.id===targetId);
          if(fromIdx<0 || toIdx<0) return;
          const [moved] = master.splice(fromIdx,1);
          master.splice(toIdx,0,moved);
          await saveMaster();
          renderMaster(content);
        });
      });
    }
  }

  function masterRow(m, draggable){
    const usage = USAGE_TYPES.find(u=>u.value===m.usageType) || USAGE_TYPES[1];
    return `
      <div class="sw-row" ${draggable?'draggable="true"':''} data-id="${m.id}">
        ${draggable?`<span class="sw-drag-handle" title="ลากเพื่อจัดลำดับ" style="cursor:grab;color:var(--ink-soft);display:flex;align-items:center;">${iconDrag()}</span>`:''}
        <span class="sw-row-name">${escapeHtml(m.name)}</span>
        <span class="sw-row-sub">${escapeHtml(m.category||'-')}</span>
        <span class="sw-row-sub">หน่วย: ${escapeHtml(m.unit)}</span>
        <span class="sw-tag ${m.usageType==='per_bowl'?'pb':'gen'}">${usage.label}</span>
        ${m.usageType==='per_bowl'&&m.qtyPerBowl?`<span class="sw-row-sub">${fmtNum(m.qtyPerBowl)} ${escapeHtml(m.unit)}/ชาม</span>`:''}
        ${m.minStock?`<span class="sw-row-sub">ขั้นต่ำ: ${fmtNum(m.minStock)} ${escapeHtml(m.unit)}</span>`:''}
        <span class="sw-row-actions">
          <button class="sw-icon-btn" data-medit="${m.id}" title="แก้ไข">${iconPencil()}</button>
          <button class="sw-icon-btn" data-mdel="${m.id}" title="ลบ">${iconTrash()}</button>
        </span>
      </div>
    `;
  }

  function openMasterModal(id){
    const m = id ? master.find(x=>x.id===id) : null;
    const isCustomCatInit = m && m.category && !CATEGORY_OPTIONS.slice(0,-1).includes(m.category);
    const draft = {
      name: m ? m.name : '',
      unit: m ? m.unit : UNITS[0],
      categorySelect: m ? (isCustomCatInit ? CATEGORY_OPTIONS[CATEGORY_OPTIONS.length-1] : m.category) : CATEGORY_OPTIONS[0],
      categoryCustom: isCustomCatInit ? m.category : '',
      usageType: m ? (m.usageType||'general') : 'general',
      qtyPerBowl: m && m.qtyPerBowl ? m.qtyPerBowl : 1,
      minStock: m && m.minStock ? m.minStock : '',
    };

    const overlay = document.createElement('div');
    overlay.className='sw-overlay';

    function captureDraft(){
      const box = document.getElementById('mf-modal-box');
      if(!box) return;
      draft.name = box.querySelector('#mf-name').value;
      draft.unit = box.querySelector('#mf-unit').value;
      draft.categorySelect = box.querySelector('#mf-category-select').value;
      const custom = box.querySelector('#mf-category-custom');
      if(custom) draft.categoryCustom = custom.value;
      const qpb = box.querySelector('#mf-qtyperbowl');
      if(qpb) draft.qtyPerBowl = qpb.value;
      draft.minStock = box.querySelector('#mf-min').value;
    }

    function bodyHtml(){
      return `
        <h2>${m?'แก้ไขรายการวัตถุดิบ':'เพิ่มรายการวัตถุดิบใหม่'}</h2>
        <div class="sw-field">
          <label>ชื่อรายการ</label>
          <input id="mf-name" value="${escapeHtml(draft.name)}" placeholder="เช่น ถุงมือยาง, ซองพริกไทย">
        </div>
        <div class="sw-row2">
          <div class="sw-field">
            <label>หน่วยนับ</label>
            <select id="mf-unit">${UNITS.map(u=>`<option ${draft.unit===u?'selected':''}>${u}</option>`).join('')}</select>
          </div>
          <div class="sw-field">
            <label>หมวดหมู่</label>
            <select id="mf-category-select">
              ${CATEGORY_OPTIONS.map(c=>`<option value="${escapeHtml(c)}" ${draft.categorySelect===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="sw-field" id="mf-category-custom-wrap" style="${draft.categorySelect===CATEGORY_OPTIONS[CATEGORY_OPTIONS.length-1]?'':'display:none;'}">
          <label>ระบุหมวดหมู่เอง</label>
          <input id="mf-category-custom" value="${escapeHtml(draft.categoryCustom)}" placeholder="พิมพ์ชื่อหมวดหมู่">
        </div>
        <div class="sw-field">
          <label>ลักษณะการใช้งาน</label>
          <div class="sw-typetoggle">
            <button type="button" class="in ${draft.usageType==='per_bowl'?'active':''}" id="mf-usage-pb">ผันแปรตามชาม</button>
            <button type="button" class="out ${draft.usageType==='general'?'active':''}" id="mf-usage-gen">ทั่วไป</button>
          </div>
          <div class="sw-hint" style="margin-top:6px;">${(USAGE_TYPES.find(u=>u.value===draft.usageType)||{}).hint||''}</div>
        </div>
        <div class="sw-field" id="mf-qtyperbowl-wrap" style="${draft.usageType==='per_bowl'?'':'display:none;'}">
          <label>จำนวนที่ใช้ต่อ 1 ชาม</label>
          <input id="mf-qtyperbowl" type="number" step="0.01" min="0" value="${draft.qtyPerBowl}" placeholder="1">
        </div>
        <div class="sw-field">
          <label>สต๊อกขั้นต่ำ (แจ้งเตือนเมื่อใกล้หมด, ไม่บังคับ)</label>
          <input id="mf-min" type="number" step="0.01" min="0" value="${draft.minStock}" placeholder="0">
        </div>
        <div class="sw-modal-actions">
          <button class="sw-btn-secondary" id="mf-cancel">ยกเลิก</button>
          <button class="sw-btn-primary" id="mf-save">${m?'บันทึกการแก้ไข':'เพิ่มรายการ'}</button>
        </div>
      `;
    }

    overlay.innerHTML = `<div class="sw-modal" id="mf-modal-box">${bodyHtml()}</div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });

    function rerender(focusId){
      const box = document.getElementById('mf-modal-box');
      box.innerHTML = bodyHtml();
      bindEvents();
      if(focusId){ const el=box.querySelector('#'+focusId); if(el) el.focus(); }
    }

    function bindEvents(){
      const box = document.getElementById('mf-modal-box');
      box.querySelector('#mf-cancel').onclick = ()=>overlay.remove();
      box.querySelector('#mf-usage-pb').onclick = ()=>{ captureDraft(); draft.usageType='per_bowl'; rerender(); };
      box.querySelector('#mf-usage-gen').onclick = ()=>{ captureDraft(); draft.usageType='general'; rerender(); };
      box.querySelector('#mf-category-select').onchange = ()=>{ captureDraft(); rerender(); };
      box.querySelector('#mf-save').onclick = (ev)=>{
        withLoading(ev.currentTarget, 'กำลังบันทึก...', async ()=>{
          captureDraft();
          const name = draft.name.trim();
          if(!name){ toast('กรุณาระบุชื่อรายการ'); throw new Error('validation'); }
          let category = draft.categorySelect;
          if(category===CATEGORY_OPTIONS[CATEGORY_OPTIONS.length-1]){
            category = (draft.categoryCustom||'').trim();
          }
          const payload = {
            id: m?m.id:uid('m'),
            name,
            unit: draft.unit,
            category,
            usageType: draft.usageType,
            qtyPerBowl: draft.usageType==='per_bowl' ? (parseFloat(draft.qtyPerBowl)||1) : 0,
            minStock: parseFloat(draft.minStock)||0,
          };
          if(m){ master[master.findIndex(x=>x.id===m.id)] = payload; }
          else{ master.push(payload); }
          await saveMaster();
          overlay.remove();
          render();
          toast(m?'แก้ไขรายการแล้ว':'เพิ่มรายการแล้ว');
        });
      };
    }
    bindEvents();
    document.getElementById('mf-modal-box').querySelector('#mf-name').focus();
  }

  function confirmDeleteMaster(id){
    const m = master.find(x=>x.id===id);
    if(!m) return;
    const count = txCountFor(id);
    const overlay = document.createElement('div');
    overlay.className='sw-overlay';
    overlay.innerHTML = `
      <div class="sw-modal" style="max-width:380px;">
        <h2>ยืนยันการลบ</h2>
        <p style="font-size:14px;color:var(--ink-soft);margin:0 0 16px;">
          ต้องการลบ <b style="color:var(--ink);">${escapeHtml(m.name)}</b> ออกจากรายการวัตถุดิบใช่หรือไม่?
        </p>
        ${count>0?`<p style="font-size:12.5px;color:var(--red);margin:-8px 0 16px;">รายการนี้มีประวัติการทำรายการ ${count} ครั้ง หากลบแล้วจะไม่แสดงในหน้าสต๊อกอีกต่อไป (แต่ประวัติเดิมยังคงอยู่)</p>`:''}
        <div class="sw-modal-actions">
          <button class="sw-btn-secondary" id="mdel-cancel">ยกเลิก</button>
          <button class="sw-btn-danger" id="mdel-confirm">ลบรายการ</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#mdel-cancel').onclick = ()=>overlay.remove();
    overlay.querySelector('#mdel-confirm').onclick = (ev)=>{
      withLoading(ev.currentTarget, 'กำลังลบ...', async ()=>{
        master = master.filter(x=>x.id!==id);
        await saveMaster();
        overlay.remove();
        render();
        toast('ลบรายการแล้ว');
      });
    };
  }

  // ---- STOCK TAB ----
  function renderStock(content){
    const {state} = computeLedger();
    let rows = master.map(m=>{
      const s = currentStockFor(m.id, state);
      const isLow = m.minStock>0 && s.qty <= m.minStock;
      return {m, s, isLow};
    });
    if(lowStockOnly) rows = rows.filter(r=>r.isLow);
    rows.sort((a,b)=> a.m.name.localeCompare(b.m.name,'th'));

    const totalValue = master.reduce((sum,m)=> sum + currentStockFor(m.id,state).value, 0);
    const lowCount = master.filter(m=>{
      const s = currentStockFor(m.id,state);
      return m.minStock>0 && s.qty<=m.minStock;
    }).length;

    content.innerHTML = `
      <div class="sw-receipt">
        <div class="sw-receipt-row"><span class="lbl">รายการทั้งหมด</span><span class="val">${master.length} รายการ</span></div>
        <div class="sw-receipt-row"><span class="lbl">ใกล้หมด</span><span class="val ${lowCount>0?'warn':''}">${lowCount} รายการ</span></div>
        <div class="sw-receipt-total"><span class="lbl">มูลค่าสต๊อกรวม</span><span class="val">฿${fmtMoney(totalValue)}</span></div>
      </div>
      <div class="sw-toolbar">
        <button class="sw-chip ${!lowStockOnly?'active':''}" id="sw-s-all">ทั้งหมด</button>
        <button class="sw-chip ${lowStockOnly?'active':''}" id="sw-s-low">ใกล้หมดเท่านั้น</button>
      </div>
      <div class="sw-list">
        ${rows.length===0?`<div class="sw-empty">ไม่พบรายการ</div>`:rows.map(stockRow).join('')}
      </div>
    `;
    document.getElementById('sw-s-all').onclick = ()=>{ lowStockOnly=false; renderStock(content); };
    document.getElementById('sw-s-low').onclick = ()=>{ lowStockOnly=true; renderStock(content); };
  }

  function stockRow(r){
    const {m,s,isLow} = r;
    return `
      <div class="sw-row ${isLow?'low':''}">
        <span class="sw-row-name">${escapeHtml(m.name)}</span>
        <span class="sw-tag ${isLow?'low':'ok'}">${isLow?'ใกล้หมด':'ปกติ'}</span>
        <span class="sw-row-num">${fmtNum(s.qty)} ${escapeHtml(m.unit)}</span>
        <span class="sw-row-sub">฿${fmtMoney(s.avgCost)}/${escapeHtml(m.unit)}</span>
        <span class="sw-row-num" style="font-weight:600;">฿${fmtMoney(s.value)}</span>
      </div>
    `;
  }

  // ---- TRANSACTIONS TAB ----
  function renderTx(content){
    const {ledger} = computeLedger();
    let rows = [...ledger].sort((a,b)=> new Date(b.date)-new Date(a.date) || String(b.id).localeCompare(String(a.id)));
    if(txFilterItem!=='all') rows = rows.filter(r=>r.itemId===txFilterItem);
    if(txFilterType!=='all') rows = rows.filter(r=>r.type===txFilterType);

    content.innerHTML = `
      <div class="sw-toolbar">
        <select class="sw-select" id="sw-t-item">
          <option value="all">ทุกรายการ</option>
          ${master.map(m=>`<option value="${m.id}" ${txFilterItem===m.id?'selected':''}>${escapeHtml(m.name)}</option>`).join('')}
        </select>
        <button class="sw-chip ${txFilterType==='all'?'active':''}" data-ft="all">ทั้งหมด</button>
        <button class="sw-chip ${txFilterType==='in'?'active':''}" data-ft="in">เข้า</button>
        <button class="sw-chip ${txFilterType==='out'?'active':''}" data-ft="out">ออก</button>
        <button class="sw-add" id="sw-t-add">${iconPlus()} บันทึกรายการ</button>
      </div>
      <div class="sw-list">
        ${rows.length===0?`<div class="sw-empty">ยังไม่มีประวัติการทำรายการ</div>`:rows.map(txRow).join('')}
      </div>
    `;
    document.getElementById('sw-t-item').onchange = (e)=>{ txFilterItem=e.target.value; renderTx(content); };
    content.querySelectorAll('[data-ft]').forEach(b=> b.onclick = ()=>{ txFilterType=b.dataset.ft; renderTx(content); });
    document.getElementById('sw-t-add').onclick = ()=>openTxModal(null);
    content.querySelectorAll('[data-tedit]').forEach(b=> b.onclick = ()=>openTxModal(b.dataset.tedit));
    content.querySelectorAll('[data-tdel]').forEach(b=> b.onclick = ()=>confirmDeleteTx(b.dataset.tdel));
  }

  function txRow(t){
    const item = master.find(m=>m.id===t.itemId);
    const unit = item?item.unit:'';
    return `
      <div class="sw-row type-${t.type}">
        <span class="sw-tag ${t.type}">${t.type==='in'?'เข้า':'ออก'}</span>
        <span class="sw-row-name">${escapeHtml(item?item.name:'(รายการถูกลบ)')}</span>
        <span class="sw-row-sub">${fmtDate(t.date)}</span>
        <span class="sw-row-num">${fmtNum(t.quantity)} ${escapeHtml(unit)}</span>
        <span class="sw-row-sub">฿${fmtMoney(t.computedUnitCost)}/${escapeHtml(unit)}</span>
        <span class="sw-row-num" style="font-weight:600;">฿${fmtMoney(t.computedTotalCost)}</span>
        ${t.note?`<span class="sw-row-sub" title="${escapeHtml(t.note)}">📝 ${escapeHtml(t.note)}</span>`:''}
        <span class="sw-row-actions">
          <button class="sw-icon-btn" data-tedit="${t.id}" title="แก้ไข">${iconPencil()}</button>
          <button class="sw-icon-btn" data-tdel="${t.id}" title="ลบ">${iconTrash()}</button>
        </span>
      </div>
    `;
  }

  function openTxModal(id){
    const t = id ? transactions.find(x=>x.id===id) : null;
    const draft = {
      type: t ? t.type : 'in',
      itemId: t ? t.itemId : (master[0]?master[0].id:''),
      date: t ? t.date : new Date().toISOString().slice(0,10),
      quantity: t ? t.quantity : '',
      totalPrice: t && t.unitCost ? (Number(t.unitCost)*Number(t.quantity||0)) : '',
      note: t ? (t.note||'') : '',
    };
    const overlay = document.createElement('div');
    overlay.className='sw-overlay';

    function captureDraft(){
      const box = document.getElementById('tf-modal-box');
      if(!box || master.length===0) return;
      const itemSel = box.querySelector('#tf-item'); if(itemSel) draft.itemId = itemSel.value;
      const dateEl = box.querySelector('#tf-date'); if(dateEl) draft.date = dateEl.value;
      const qtyEl = box.querySelector('#tf-qty'); if(qtyEl) draft.quantity = qtyEl.value;
      const tpEl = box.querySelector('#tf-totalprice'); if(tpEl) draft.totalPrice = tpEl.value;
      const noteEl = box.querySelector('#tf-note'); if(noteEl) draft.note = noteEl.value;
    }

    function bodyHtml(){
      const {state} = computeLedger();
      const selectedItem = master.find(m=>m.id===draft.itemId) || master[0];
      const stockInfo = selectedItem ? currentStockFor(selectedItem.id, state) : null;
      return `
        <h2>${t?'แก้ไขรายการ':'บันทึกรายการใหม่'}</h2>
        <div class="sw-field">
          <label>ประเภทรายการ</label>
          <div class="sw-typetoggle">
            <button type="button" class="in ${draft.type==='in'?'active':''}" id="tf-type-in">รับเข้า (ซื้อเข้า)</button>
            <button type="button" class="out ${draft.type==='out'?'active':''}" id="tf-type-out">ตัดออก (ใช้ในรอบขาย)</button>
          </div>
        </div>
        ${master.length===0? `<p style="font-size:13px;color:var(--red);">ยังไม่มีรายการวัตถุดิบ กรุณาไปเพิ่มที่แท็บ "รายการวัตถุดิบ" ก่อน</p>` : `
        <div class="sw-field">
          <label>รายการวัตถุดิบ</label>
          <select id="tf-item">
            ${master.map(m=>`<option value="${m.id}" ${selectedItem&&selectedItem.id===m.id?'selected':''}>${escapeHtml(m.name)}</option>`).join('')}
          </select>
        </div>
        <div class="sw-row2">
          <div class="sw-field">
            <label>วันที่</label>
            <input id="tf-date" type="date" value="${draft.date}">
          </div>
          <div class="sw-field">
            <label>จำนวน</label>
            <input id="tf-qty" type="number" step="0.01" min="0" value="${draft.quantity}" placeholder="0">
          </div>
        </div>
        <div class="sw-field" id="tf-unitcost-wrap" style="${draft.type==='out'?'display:none;':''}">
          <label>ราคารวมที่จ่าย (บาท)</label>
          <input id="tf-totalprice" type="number" step="0.01" min="0" value="${draft.totalPrice}" placeholder="0.00">
          <div class="sw-hint" id="tf-computed-unit" style="margin-top:6px;">
            ${(Number(draft.quantity)>0 && Number(draft.totalPrice)>0) ? `≈ ฿${fmtMoney(Number(draft.totalPrice)/Number(draft.quantity))} ต่อหน่วย` : 'กรอกจำนวนและราคารวม เพื่อคำนวณต้นทุนต่อหน่วยให้อัตโนมัติ'}
          </div>
        </div>
        ${stockInfo?`<div class="sw-hint" id="tf-stock-hint">คงเหลือปัจจุบัน: ${fmtNum(stockInfo.qty)} ${escapeHtml(selectedItem.unit)} · ต้นทุนเฉลี่ย ฿${fmtMoney(stockInfo.avgCost)}/${escapeHtml(selectedItem.unit)}</div>`:''}
        <div class="sw-field">
          <label>${draft.type==='in'?'อ้างอิงบิลซื้อ / ผู้ขาย (ไม่บังคับ)':'อ้างอิงรอบขาย / หมายเหตุ (ไม่บังคับ)'}</label>
          <input id="tf-note" value="${escapeHtml(draft.note)}" placeholder="${draft.type==='in'?'เช่น บิลเลขที่, ร้านค้า':'เช่น ชื่อ event, วันที่ออกร้าน'}">
        </div>
        `}
        <div class="sw-modal-actions">
          <button class="sw-btn-secondary" id="tf-cancel">ยกเลิก</button>
          <button class="sw-btn-primary" id="tf-save" ${master.length===0?'disabled':''}>${t?'บันทึกการแก้ไข':'บันทึกรายการ'}</button>
        </div>
      `;
    }

    overlay.innerHTML = `<div class="sw-modal" id="tf-modal-box">${bodyHtml()}</div>`;
    document.body.appendChild(overlay);
