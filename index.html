<div id="pin-gate" style="position:fixed;inset:0;z-index:9999;background:#FBF7EF;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;">
  <div style="background:#FFFFFF;border:1px solid #E7DCC9;border-radius:14px;padding:32px 28px;max-width:320px;width:90%;text-align:center;box-sizing:border-box;">

<style>

@import url('https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#FEF8E6;
  --surface:#FFFFFF;
  --ink:#21201C;
  --ink-soft:#4A4940;
  --green:#5E8C42;
  --green-light:#BCD38F;
  --green-soft:#E7EFD8;
  --red:#EE5533;
  --red-soft:#FDE1DA;
  --gold:#FFF3CC;
  --gold-soft:#FFF9E8;
  --coral:#EE5533;
  --coral-soft:#FEC0CD;
  --blue:#ACD3EF;
  --blue-soft:#E3F1FA;
  --border:#21201C;
  --fill-muted:#E3DED2;
  --radius:16px;
  --header-red:#ACD3EF;
}
html body{
  background-color:var(--bg);
}
h1,h2,h3,h4{font-weight:700;color:var(--ink);}
*{box-sizing:border-box;}
body,.faw-root{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;
}
.faw-root{padding:20px 16px 60px;max-width:760px;margin:0 auto;}

.faw-header{margin-bottom:18px;}
.faw-eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:4px;
}
.faw-title{
  font-family:'Taviraj',serif;font-weight:600;font-size:28px;
  margin:0 0 2px;color:var(--ink);
}
.faw-sub{font-size:13px;color:var(--ink-soft);}

/* Receipt summary */
.faw-receipt{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 22px;margin-bottom:22px;
  position:relative;
  background-image:
    radial-gradient(circle at 0 0, transparent 8px, var(--surface) 8.5px) 0 -8px / 100% 100%,
    radial-gradient(circle at 100% 0, transparent 8px, var(--surface) 8.5px);
}
.faw-receipt-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:6px 0;font-size:13.5px;
}
.faw-receipt-row + .faw-receipt-row{border-top:1px dashed var(--border);}
.faw-receipt-row .lbl{color:var(--ink-soft);}
.faw-receipt-row .val{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.faw-receipt-total{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:10px;padding-top:12px;border-top:2px solid var(--ink);
  font-family:'Taviraj',serif;
}
.faw-receipt-total .lbl{font-size:15px;font-weight:600;}
.faw-receipt-total .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--green);}
